not_checked: "Die Peer-Gruppe Building Materials (16 Firmen) mischt Baustoffhändler, Dämmstoffe, Holz und Fertigteile; Janus liefert Türen und Zutritt für Selbstlager, die Passung ist begrenzt. Das Archiv trägt die Marke Aktienzahl ungeprüft. Net Debt/EBITDA und EV/EBITDA der Firma sind bereinigte Größen (Firmen-Definition, nicht die Stufe-1-Rechnung); mit dem Betriebsergebnis laut Rechnung ohne Abschreibungen fiele die Quote höher aus. Der Kaufpreis von Kiwi II, die Höhe der Zollerstattung, der Jahresausblick im Vergleich zum Vorquartal und der heutige Kurs sind offen. Entwurf des Agenten, ohne die Prompts Bear/Bull/Synthese."
peer_note: "Vollständige Peer-Gruppe aus dem Zwischenspeicher neu gerechnet (Export vom 12.10.2026). Rosa Balken: in Stufe 2 durchgefallen; 1 Firma ohne FCF-Wert (fehlende Investitionen)."
peer_summary: "Gegen die 16 Firmen der Peer-Gruppe: EV/EBITDA 5,9 gegen Median 8,9 (Platz 1 von 16, die günstigste), FCF-Rendite 26,0 % gegen Median 6,3 % (Platz 1 von 15, die höchste). Beides sind Archivwerte der Geschäftsjahre; auf den letzten zwölf Monaten liegt die FCF-Rendite bei 14,2 %, das Betriebsergebnis fällt."
