thesis: >-
  UFP Industries stellt Produkte aus Holz und Verbundstoffen her (Terrassendielen, Paletten und Verpackungen, Bauteile für den
  Hausbau). Auf den Geschäftsjahren besteht die Firma die Prüfungen mit einer Nettokasse (EV/EBITDA 7,4, Platz 3 von 33; ROIC 16,5 %).
  Die Entwicklung zeigt aber nach unten: Umsatz von 7.218 (2023) auf 6.320 Mio. $ (2025), Betriebsergebnis von 647 auf 364 Mio. $,
  freier Cashflow von 780 über 410 auf 276 Mio. $. Im 1. Halbjahr 2026 sank das Betriebsergebnis um 22 % auf 167,5 Mio. $. Der
  Dreijahresschnitt (10,9 % FCF-Rendite) sieht die Lage besser, als sie heute ist: Auf zwölf Monaten liegt die FCF-Rendite bei etwa
  5,8 %.
