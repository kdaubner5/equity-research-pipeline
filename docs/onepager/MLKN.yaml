bear:
- 'Kein fester Konzernchef: Jeff Stutz ist Interimschef seit dem Ruhestand von Andi Owen.'
- Umsatzprognose FY27 gesenkt (3,88 bis 4,03 Mrd. $ statt 3,93 bis 4,13); „weichere Nachfrage als erwartet“; Nordamerika-Contract -5,3 %.
- 'Verschuldung: Net Debt/EBITDA laut Kreditvertrag 2,75x; Schulden 1.307 Mio. $ gegen Kasse 179 Mio. $.'
- Das Quartal enthält rund 10 Mio. $ Zollrückerstattung (0,11 $ je Aktie; weitere Ansprüche werden verfolgt); ohne sie läge der bereinigte Gewinn je Aktie bei etwa 0,42 $ (Überschlag des Agenten).
- 'Betriebsergebnis Q1 51,8 Mio. $ nach 53,5; Betriebsergebnis 2025 war nur 50,5 Mio. $ (2026: 198,3).'
bull:
- Bestellungen +3,2 % (organisch +3,5 %) im Quartal, bereinigter Gewinn je Aktie +18 %.
- Betriebsergebnis FY26 198,3 Mio. $ (nach 50,5 im Jahr zuvor; bereinigt jedoch 238,4 nach 248,7); Gewinnprognose FY27 unverändert (1,85 bis 2,15 $).
- Operativer Cashflow Q1 49,1 Mio. $ nach 9,4 Mio. $.
- 'Kosten und Bilanz im Fokus: „Prioritäten setzen, Kosten steuern, Bilanz stärken“ (Interimschef).'
- Dividende 0,1875 $ je Quartal fortgeführt.
