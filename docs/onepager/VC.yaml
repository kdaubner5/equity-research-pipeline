not_checked: "Die Peer-Gruppe Engineering & Construction (17 Firmen) passt kaum: Sie enthält Bau- und Ingenieurfirmen sowie Maschinenbauer wie Kennametal und Terex; Visteon ist ein Autozulieferer (SimFin ordnet ihn dort ein). Das bereinigte EBITDA ist die Größe der Firma und addiert unter anderem aktienbasierte Vergütung zurück (50 Mio. $ im Jahr). Das Betriebsergebnis nach GAAP ist in den gelesenen Texten nicht ausgewiesen; die Marge ist deshalb als bereinigte EBITDA-Marge gezeigt. Gewinn 2023 (568 Mio. $) enthält nach Angabe der Unternehmensdaten einen Steuereffekt, nicht im Detail geprüft. Offen sind der heutige Kurs, die Wirkung der Zölle, die Lage in China und die genaue Verteilung der Aufträge. Entwurf des Agenten, ohne die Prompts Bear/Bull/Synthese."
peer_note: "Vollständige Peer-Gruppe aus dem Zwischenspeicher neu gerechnet (Export vom 12.10.2026); in der Gruppe fehlen keine Firmen wegen fehlender Fundamentaldaten. Die Gruppe passt schlecht zu einem Autozulieferer."
peer_summary: "Gegen die 17 Firmen der Peer-Gruppe: EV/EBITDA 4,6 gegen Median 13,4 (Platz 2 von 17), FCF-Rendite 9,5 % gegen Median 4,3 % (Platz 4 von 16). Archivwerte der Geschäftsjahre. Die Gruppe passt schlecht (Bau, Ingenieure, Maschinenbau); der Vergleich mit anderen Autozulieferern fehlt."
