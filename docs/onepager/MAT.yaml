thesis: Mattel macht Spielzeug (Barbie, Hot Wheels, Fisher-Price) und zunehmend Lizenz- und Spielegeschäft. Im 2. Quartal 2026 stieg der Umsatz um 10 % auf 1.125 Mio. $, aber die Bruttomarge fiel um 2,7 Prozentpunkte auf 48,2 % (Zölle, Inflation, höhere Lizenzgebühren, Währung); das Betriebsergebnis betrug 11 Mio. $ nach 79. Im ersten Halbjahr steht ein Betriebsverlust von 91,8 Mio. $ (Vorjahr +25,5). Der Halbjahres-Nettogewinn von 42,8 Mio. $ enthält einen nicht zahlungswirksamen Gewinn von 147,9 Mio. $ aus der Neubewertung des früheren Anteils an Mattel163, das Mattel im März ganz übernommen hat. Der freie Cashflow der letzten zwölf Monate liegt bei rund 435 Mio. $, die Nettoschulden bei 1,8 Mrd. $ (saisonal, Kasse ist zur Jahresmitte niedrig). Am 30.09.2026 wurde bekannt, dass Konzernchef und Chairman Ynon Kreiz zum 02.10.2026 geht; Roger Lynch (bisher Condé Nast) folgt spätestens zum 02.11.2026.
