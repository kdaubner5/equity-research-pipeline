thesis: Sally Beauty verkauft Haarfarbe und Schönheitsprodukte an Profis und Endkunden (Geschäftsjahr bis 30.09.), mit den Sparten Sally Beauty Supply und Beauty Systems Group. Im 3. Quartal 2026 blieb der Umsatz mit 935 Mio. $ (+0,2 %) fast gleich, die Bruttomarge stieg um 0,9 Prozentpunkte auf 52,4 %, der Gewinn je Aktie um 25 % auf 0,55 $ (bereinigt +8 %). Der operative Cashflow der ersten neun Monate stieg auf 247,5 Mio. $ (Vorjahr 154,0); der 10-Q nennt Fälligkeiten von Verbindlichkeiten, höhere Kundenzahlungen, geringere Steuerzahlungen und die Rückzahlung von Vermieterforderungen für die neue Zentrale als Gründe (das Lager stieg leicht auf 996 Mio. $). Der freie Cashflow der letzten zwölf Monate liegt bei rund 241 Mio. $ (15,1 % des Börsenwerts laut Archivkurs); die Firma selbst peilt für das Gesamtjahr rund 200 Mio. $ an. Die Nettoschulden betragen rund 642 Mio. $ (Verschuldungsgrad laut Firma 1,4x), seit Jahresbeginn wurden 57 Mio. $ Term-Loan-B zusätzlich getilgt.
