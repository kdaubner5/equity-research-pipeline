thesis: >-
  Boyd Gaming betreibt Regionalkasinos (Mittlerer Westen, Süden, Las Vegas) und ein Online-Geschäft. Auf den Geschäftsjahren ist die
  Firma günstig (EV/EBITDA 6,0, Platz 3 von 24; Dreijahresmittel des freien Cashflows 495 Mio. $). 2025 verkaufte Boyd die 5-%-Beteiligung an FanDuel für 1,758 Mrd. $ in bar, tilgte damit Schulden
  und kauft Aktien zurück. 2026 kippt das Bild bei den Zahlen: Das Betriebsergebnis fiel im 1. Halbjahr um 18 % auf 364,7 Mio. $,
  der operative Cashflow brach auf 110,8 Mio. $ ein (Vorjahr 461,4), und die Investitionen von 297,1 Mio. $ (Neubauten in Norfolk und
  Cadence Crossing, Renovierungen) ließen den freien Cashflow auf -186 Mio. $ fallen. Auf zwölf Monaten bleibt rund 35 Mio. $ (0,7 %).
  Die Verschuldung stieg nach Agent-Rechnung auf rund 2,2 Mal EBITDA (Stufe 1 auf Basis 2025: 1,43).
