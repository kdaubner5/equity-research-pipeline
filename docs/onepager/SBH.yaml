- Umsatz kaum gewachsen (+0,2 % im 3. Quartal, vergleichbar flach); Beauty Systems Group -2,4 % im Quartal.
- Betriebsergebnis der ersten neun Monate 234 Mio. $ nach 248 (-5,5 %).
