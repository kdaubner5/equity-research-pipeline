not_checked: "Die Peer-Gruppe Travel & Leisure (24 Firmen) passt kaum (Spielzeug, Boote, Fitness, Haustierbedarf); nur wenige Kasinobetreiber sind echte Vergleichsfirmen. Das Archiv trägt die Marken Aktienzahl ungeprüft und für Stufe 1 die Datenmarke `debt_component_missing_defaulted_zero`; die Verschuldung 1,87 des Archivs ist nicht nachgerechnet. Der Verkaufsgewinn (rund 287 Mio. $) ist aus der Posten-Zeile Grundstücks- und Vermögensgeschäfte (property transactions, net) abgeleitet und nicht im Detail geprüft; der EV (Börsenwert + Schulden - Kasse + Minderheiten zum Buchwert 853,9 Mio. $) ist grob. Das gesamte bereinigte EBITDA der letzten zwölf Monate wurde nicht gerechnet. Offen sind der Anteil der Minderheiten am Cashflow, die Mietdeckung (VICI), der Kapitalbedarf für Osaka und der heutige Kurs. Entwurf des Agenten, ohne die Prompts Bear/Bull/Synthese."
peer_note: "Vollständige Peer-Gruppe aus dem Zwischenspeicher neu gerechnet (Export vom 12.10.2026); 1 Firma fehlt wegen Datenfehlers (MMYT). Große Gruppe: gezeigt ist ein Ausschnitt um MGM. Die Gruppe passt schlecht."
peer_summary: "Gegen die 24 Firmen der Peer-Gruppe: EV/EBITDA 6,2 gegen Median 10,5 (Platz 4 von 24), FCF-Rendite 16,9 % gegen Median 7,4 % (Platz 1 von 21). Archivwerte der Geschäftsjahre; die Gruppe passt schlecht, und Mieten, Minderheiten und Gewinn je Aktie sind darin nicht berücksichtigt."
