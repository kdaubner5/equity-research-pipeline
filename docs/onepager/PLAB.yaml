thesis: >-
  Photronics stellt Fotomasken her (Schablonen zur Belichtung von Chips und Bildschirmen). Im 3. Quartal des Geschäftsjahres (Ende 02.08.2026) stieg der
  Umsatz um 2,7 % auf 216,0 Mio. $, der Nettogewinn auf 28,9 Mio. $; der Anteil anspruchsvoller Chip-Masken erreichte mit 44 % einen Rekord. Die Bilanz
  hat kaum Schulden und 672,8 Mio. $ Kasse und kurzfristige Anlagen, davon 503,5 Mio. $ in Gemeinschaftsunternehmen (50,01 % gehalten). Das EV/EBITDA
  der Karte (5,8) rechnet mit den letzten zwölf Monaten und den Minderheiten (463 Mio. $); das Stufe-2-Maß (4,5) stammt aus 2025 ohne Minderheiten.
  Die Schwäche: hohe Investitionen (2025: 188 Mio. $; 2026 geplant 255 bis 305 Mio. $) halten den freien Cashflow bei rund 6 % des Börsenwerts.
