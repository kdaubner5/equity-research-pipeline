not_checked: "Die Peer-Gruppe ist grob (Branchenebene, 51 Firmen) und mischt Chemie, Baustoffe, Kohle, Metalle, Dünger und Papier; die Passung zu einem Papierhersteller ist gering. Bereinigtes EBITDA ist die Größe der Firma (Definition nicht geprüft); Nettoschulden sind aus Schulden minus Kasse laut Pressemitteilung gerechnet. Offen sind der heutige Kurs, Pensions- und Umweltverpflichtungen, die Lage der Brasilien-Werke (Währung, Zölle) und die Wirkung der Zölle. Das Archiv führt die Firma mit Marke zyklische Branche; die Verschuldung bei Zyklikern hängt stark vom Konjunkturtief ab. Entwurf des Agenten, ohne die Prompts Bear/Bull/Synthese."
peer_note: "Vollständige Peer-Gruppe aus dem Zwischenspeicher neu gerechnet (Export vom 12.10.2026); 12 Firmen fehlen wegen Datenfehlern (AGI, ASM, ASTL, IPX, NAK, NG, NIOBF, PKX, SID, SSL, SSRM, WS). Große Gruppe: gezeigt ist ein Ausschnitt um SLVM."
