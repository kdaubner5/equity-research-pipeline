bear:
- 'Pool-Handel baut Lager ab: Umsatz Q2 -17 %, Betriebsergebnis 167 Mio. $ nach 218; die Firma nennt es eine „vorübergehende Kanalbereinigung“.'
- 'Taco-Kauf 1,425 Mrd. $: dazu bis zu 1,4 Mrd. $ neue Term Loans, die Schulden würden sich fast verdoppeln.'
- In Q2 stecken rund 35 Mio. $ einmalige Zollrückerstattung; ohne sie wäre das Ergebnis niedriger.
- Finanzchef-Posten war zuletzt nur interimistisch besetzt; Neubesetzung ab 01.11.2026.
- Gewinn je Aktie 2026 (bereinigt 4,60 bis 4,80 $) ist abhängig von einer Erholung im 2. Halbjahr.
bull:
- Bereinigte Marge im Quartal 25,4 % trotz Lagerabbau; Bereiche Flow und Water Solutions laufen „solide“ (Firma).
- Freier Cashflow 1. Halbjahr 467 Mio. $; Prognose bereinigter Gewinn je Aktie 2026 bestätigt.
- Rückkauf 150 Mio. $ im Quartal; 50. Jahr in Folge mit höherer Dividende (0,27 $ je Quartal).
- Gewinn aus Dauerbetrieb im 1. Halbjahr 289,4 Mio. $ (Vorjahr 303,4).
- Taco soll das Wassergeschäft erweitern (Firmenangabe; keine Zahlen zu Taco-Ergebnis in den Unterlagen).
