thesis: >-
  Janus baut Türen, Gebäude und Zutrittstechnik für Selbstlager (Self-Storage). Auf den Zahlen der Geschäftsjahre ist die Firma
  billig (EV/EBITDA 5,9, Platz 1 von 16) und erzeugt viel Cash (freier Cashflow im Dreijahresmittel rund 148 Mio. $ bei 581 Mio. $
  Börsenwert). Doch der Trend zeigt nach unten: Umsatz von 1.066 auf 884 Mio. $ (2023 bis 2025), Betriebsergebnis von 246 auf
  112 Mio. $. Im 1. Halbjahr 2026 fiel es auf 33,7 Mio. $ (Vorjahr 61,3). Die bereinigte Verschuldung stieg laut Firma von
  2,1 auf 2,7 Mal EBITDA; die Stufe-1-Grenze liegt bei 2,5. Dazu läuft ein Umbauprogramm (Restrukturierung).
