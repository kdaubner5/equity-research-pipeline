# Patterns and limits for the PreToolUse hook src/hooks/bash_guard.py
# (Issue #60, Stufe 2; docs/bash-guard.md). Every key is required, no
# defaults exist in code; a missing or malformed key makes the hook refuse
# every Bash call (fail closed). Changing a value here changes what the hook
# refuses on the very next Bash call.

# Branches that must never be pushed to, merged into, deleted or changed
# locally. Compared case-insensitively after stripping refs/heads/.
protected_branches: [master, main]

# Longest command text the hook analyses; longer commands are refused.
max_command_length: 50000
# Deepest nesting (bash -c "bash -c ...", eval, heredoc, alias) analysed;
# anything deeper is refused.
max_depth: 8

limits:
  # Total time budget for analysing one command. Claude Code does NOT block
  # a call when a hook runs into its own timeout, so this must stay below
  # hook_timeout_seconds; when it is exceeded the call is refused.
  analysis_seconds: 10
  # The `timeout` of the hook entry in .claude/settings.json (a test checks
  # that both agree).
  hook_timeout_seconds: 30
  # Time limit of one git lookup (current branch, alias) the hook runs.
  git_lookup_seconds: 5
  # Shortest `--xyz` option text treated as an abbreviation of a refused
  # long option (git accepts unique abbreviations such as --forc).
  min_long_option_abbreviation: 3

# Commands whose arguments are plain data: a segment starting with one of
# them is not scanned for git/gh (so `echo "git push origin master"` is fine).
non_executing_commands: [echo, printf, grep, egrep, fgrep, rg, which, type, man, whatis, ls, stat, wc]

# Commands that append arguments from stdin or from a list: git/gh behind
# them cannot be checked, so `git push` / `git add` / `gh pr merge` behind
# them is refused.
dynamic_arg_commands: [xargs, parallel]

# Commands that run a command given as ONE string argument (env -S "...",
# su -c "...", ssh host "...", timeout 5 "..."): every argument containing
# whitespace is analysed as a command line.
command_string_wrappers: [env, su, watch, script, timeout, ssh, tmux, flock, sudo, doas, runuser, sg, screen, nohup, setsid, nice, ionice, stdbuf, chroot, unshare, nsenter, at, batch, expect, xterm, find]

# Commands that change the working directory: the current branch of a
# later `git commit` / `git push` without a refspec is then unknown.
cwd_changing_commands: [cd, pushd, popd]

# Commands that define commands for later in the same call (aliases, traps).
refused_commands: [alias, trap]

# Commands that set environment variables for later commands.
env_setting_commands: [env, export, declare, typeset, readonly, local]
# Environment variables refused there or in front of a command (VAR=x cmd):
# they change how git/gh find config, remotes, pagers, editors or programs.
refused_env_prefixes: ["GIT_CONFIG", "GIT_DIR", "GIT_WORK_TREE", "GIT_EXEC_PATH", "GIT_SSH", "GIT_PROXY", "GIT_ASKPASS", "GIT_EXTERNAL_DIFF", "GIT_PAGER", "GIT_EDITOR", "GIT_SEQUENCE_EDITOR", "GIT_TEMPLATE_DIR", "GH_PAGER", "GH_BROWSER", "GH_EDITOR", "GH_CONFIG_DIR", "PAGER", "EDITOR", "VISUAL", "BROWSER", "BASH_ENV", "ENV", "PROMPT_COMMAND", "LD_PRELOAD", "LD_LIBRARY_PATH", "SSH_ASKPASS", "PYTHONSTARTUP"]

# The hook, its configuration, the Claude Code settings and git's own
# configuration must not be changed from a Bash call (the Edit/Write tools
# have their own ask rules).
protected_paths: ['(^|/)\.claude(/|$)', '(^|/)src/hooks(/|$)', '(^|/)config/bash_guard\.yaml$', '(^|/)\.git(/|$)', '(^|/)\.gitconfig$', '(^|/)\.config/git(/|$)']
# Commands that write to every path argument ...
path_writing_commands: [tee, cp, mv, rm, truncate, ln, install, rsync, dd, chmod, chown, shred, unlink, rmdir]
# ... and commands that write only with one of these options (in-place edit).
path_writing_with_option:
  sed: ["-i", "--in-place"]
  perl: ["-i"]
  awk: ["-i", "inplace"]
  gawk: ["-i", "inplace"]
  python: ["-i"]

# Shells: `-c STRING` is analysed recursively; a shell without -c and
# without a script file argument (or with /dev/stdin, -) reads commands from
# stdin and is refused.
shell_interpreters: [bash, sh, zsh, dash, ksh, ash, fish, csh, tcsh]
# Interpreters with inline code (python -c, node -e, heredoc bodies): the
# code is searched for an exec marker AND a deny pattern (heuristic; a
# script file or obfuscated string is not caught).
script_interpreter_patterns: ["^python[0-9.]*$", "^perl$", "^ruby$", "^node(js)?$", "^php$", "^lua$", "^deno$", "^bun$", "^g?awk$", "^mawk$", "^sed$"]
inline_exec_markers: ["subprocess", "os\\.system", "os\\.popen", "os\\.exec", "os\\.spawn", "pty\\.spawn", "popen", "child_process", "execSync", "spawnSync", "Open3", "\\bsystem\\s*\\(", "\\bexec\\b", "%x[({\\[]", "\\bqx\\b", "`", "passthru", "shell_exec", "proc_open", "getline", "\\|\\s*[\"']", "(?m)(^|[\\s;{}'\"])[0-9$]*e\\s", "/[gpiIm]*e[gpiIm]*(;|$|')", "urllib", "requests\\.", "http\\.client", "\\bfetch\\s*\\(", "axios"]
inline_deny_patterns:
  - '(?is)\bgit\b.{0,300}?\bpush\b'
  - '(?is)\bgh\b.{0,300}?\bmerge\b'
  - '(?is)\bgh\b.{0,300}?\bapi\b'
  - '(?is)github\.com'

git:
  # Options before the subcommand that take a separate value.
  global_options_with_value: ["-C", "-c", "--git-dir", "--work-tree", "--namespace", "--super-prefix", "--config-env"]
  # `git -c KEY=VALUE`, `--config-env`, and `git config KEY VALUE` (writing)
  # are allowed only for keys starting with one of these (case-insensitive);
  # every other key can define aliases, run programs or redirect a push.
  allowed_c_key_prefixes: ["user.", "color.", "advice.", "core.quotepath", "core.autocrlf", "core.safecrlf", "core.filemode", "core.whitespace", "core.precomposeunicode", "init.defaultbranch", "pull.ff", "pull.rebase", "fetch.prune", "status.", "log.", "format.", "safe.directory"]
  # Subcommands that need no alias lookup; any other subcommand is looked up
  # as a git alias (git config alias.<name>) and the alias is analysed.
  known_subcommands: [add, am, apply, archive, bisect, blame, branch, bundle, checkout, cherry-pick, clean, clone, commit, config, describe, diff, difftool, fetch, filter-branch, format-patch, gc, grep, init, log, ls-files, ls-remote, ls-tree, merge, merge-base, mv, notes, pull, push, rebase, reflog, remote, reset, restore, revert, rev-list, rev-parse, rm, shortlog, show, show-ref, sparse-checkout, stash, status, submodule, switch, symbolic-ref, tag, update-ref, worktree, version, help, send-pack]
  # Options that run a program given as a string (or fetch with one): refused
  # for that subcommand (long options also as unique abbreviation).
  refused_options_by_subcommand:
    rebase: ["-x", "--exec"]
    difftool: ["-x", "--extcmd"]
    grep: ["-O", "--open-files-in-pager"]
    fetch: ["--upload-pack"]
    pull: ["--upload-pack"]
    clone: ["-u", "--upload-pack"]
    ls-remote: ["--upload-pack", "--exec"]
    archive: ["--exec"]
  # Subcommand words that run commands (`git submodule foreach CMD`).
  refused_words_by_subcommand:
    submodule: [foreach]
    bisect: [run]
    remote: [add, set-url, rename, remove, rm, set-branches]
  push:
    # Long options (prefix match in both directions, so abbreviations such
    # as --forc and --force-with-lease are refused too).
    refused_long_options: ["--force", "--mirror", "--all", "--tags", "--follow-tags", "--delete", "--prune", "--receive-pack", "--exec"]
    # Letters in a short-option cluster (-f, -uf, -d) that are refused.
    refused_short_letters: ["f", "d"]
    options_with_value: ["--repo", "-o", "--push-option", "--signed"]
    # Destination refs: only these prefixes (or a plain branch name) pass;
    # tag pushes and refs/notes, refs/pull, ... are refused.
    allowed_destination_prefixes: ["refs/heads/"]
    refused_destination_prefixes: ["refs/tags/", "tags/"]
    # A bare refspec word that makes the next word a tag (`git push origin tag v1`).
    refused_refspec_words: ["tag"]
  add:
    refused_long_options: ["--all", "--update", "--force", "--pathspec-from-file", "--ignore-removal", "--no-ignore-removal", "--interactive", "--edit"]
    # -A (all), -u (all tracked), -f (ignored files), -i/-e (interactive)
    refused_short_letters: ["A", "u", "f", "i", "e"]
    # Pathspecs that stage "everything" or a pattern: empty, `.`, `..`, `./`, globs, any pathspec magic (`:`).
    refused_pathspec_patterns: ['^$', '^\.{1,2}/*$', '[*?\[]', '^:']
    # Pathspecs naming sensitive files or folders (case-insensitive).
    sensitive_pathspec_patterns: ['(?i)(^|/)\.env(\..*)?$', '(?i)(^|/)data(/|$)']
  commit:
    # `git commit -a/--all` stages every tracked change (not targeted staging).
    refused_short_letters: ["a"]
    refused_long_options: ["--all"]
    options_with_value: ["-m", "--message", "-F", "--file", "-C", "--reuse-message", "-c", "--reedit-message", "-t", "--template", "--author", "--date", "--cleanup", "-S", "--gpg-sign", "--trailer"]
    # letters in a short cluster after which the rest of the token is a value
    short_letters_with_value: ["m", "F", "C", "c", "t"]
  local:
    # On a protected branch these change it locally ("master is never
    # changed locally"); fast-forward only is the one allowed way.
    refused_subcommands_on_protected_branch: [commit, merge, reset, rebase, cherry-pick, revert, am]
    pull_required_option: "--ff-only"
    # With a protected branch name among the arguments these options are refused.
    refused_options_naming_protected_branch:
      checkout: ["-f", "--force", "-B", "--discard-changes"]
      switch: ["-f", "--force", "-C", "--force-create", "--discard-changes"]
      branch: ["-f", "--force", "-d", "-D", "--delete", "-m", "-M", "--move", "-c", "-C", "--copy"]
    # Always refused when a protected branch name is among the arguments.
    refused_subcommands_naming_protected_branch: [update-ref, worktree]
    # Subcommands that may switch the current branch; a later `git commit` /
    # `git push` without a refspec in the same call then has an unknown branch.
    branch_switching_subcommands: [checkout, switch, symbolic-ref, worktree]
    # Always refused.
    refused_subcommands: [send-pack, filter-branch, filter-repo]

gh:
  global_options_with_value: ["-R", "--repo", "--hostname"]
  # Subcommand pairs (case-insensitive) that are always refused.
  refused_subcommands:
    - [pr, merge]
    - [alias, set]
    - [alias, import]
    - [extension, install]
    - [config, set]
  api:
    write_methods: [PUT, POST, DELETE, PATCH]
    # Methods that are reads even when fields are given.
    read_methods: [GET, HEAD]
    # Field options turn `gh api` into a POST when no method is given.
    field_options: ["-f", "-F", "--field", "--raw-field", "--input"]
    # A header that overrides the HTTP method makes the request a write.
    write_header_patterns: ['(?i)method-override']
    # true: every write request through `gh api` is refused (the agent needs
    # none). false: only writes touching the patterns below, a protected
    # branch or an uninspectable body (=@file, --input) are refused.
    refuse_all_writes: true
    refused_argument_patterns: ['(?i)merge', '=@', '^--input(=|$)', '(?i)graphql', '(?i)/git/(refs|commits|trees|blobs)', '(?i)/contents/', '(?i)/branches/', '(?i)/dispatches', '(?i)protection', '(?i)default_branch']

http:
  clients: [curl, wget, http, https, xh, httpie]
  # Clients with HTTPie syntax (`http PUT url`, `http url a=b` posts).
  httpie_clients: [http, https, xh, httpie]
  httpie_write_patterns: ['^[^=:\s/]+=(?!=)', '^[^=:\s/]+:=', '^[^=:\s/]+=@']
  # Requests to these hosts (substring match) with a write marker are refused;
  # so is any request with an unresolved ($) URL part.
  github_hosts: ["api.github.com", "github.com", "githubusercontent.com"]
  # Long options that mark the request as a write.
  write_long_options: ["--request", "--data", "--data-raw", "--data-binary", "--data-urlencode", "--json", "--form", "--upload-file", "--post-data", "--post-file", "--body-data", "--method"]
  # Letters in a short-option cluster (curl -sd, -sXPUT) that mark a write.
  write_short_letters: ["X", "d", "F", "T"]
  # The letters that take an HTTP method (the value after it is checked).
  method_short_letters: ["X"]
  read_methods: [GET, HEAD, OPTIONS]
  # Options that read further options from a file (not inspectable).
  refused_options: ["-K", "--config"]
