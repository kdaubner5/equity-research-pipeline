bear:
- 'Schulden: langfristig 3.402 (Dezember 2025) auf 4.216 Mio. $ (Juni 2026); Paloma (+1,255 Mrd. $) kam danach dazu; Ridge Runner noch offen.'
- Zukäufe im 1. Halbjahr 1,27 Mrd. $ stehen nicht in der Investitionszeile; mit ihnen wäre der Cashflow der letzten zwölf Monate negativ.
- 'Archiv: FCF-Rendite „ungeprüft“, mit sonstigen Investitionen -3,1 % (nicht 25 %); Trend-Guard: ROIC im letzten Jahr 9,9 % unter der Schwelle.'
- Ölpreisabhängig; das Betriebsergebnis fiel 2025 auf 1.227 nach 1.435 Mio. $ (2024), im 1. Halbjahr 2026 624 nach 678.
- „Externe Gegenwinde“ und Abschaltungen von Ölmengen im Quartal laut Firma (Details nicht genannt).
bull:
- Rekordförderung (126.106 Fass Öl/Tag); Prognose Ölwachstum 2026 +7 %; Reserven +5 % auf 703 Mio. BOE.
- 'Q2: operativer Cashflow 937 Mio. $, bereinigter freier Cashflow 303 Mio. $ (Q1: 113 Mio. $).'
- Paloma-Produktion liegt laut Firma seit 01.06. rund 10 % über der Annahme des Kaufs.
- Kreditaufnahmen aus der Pachtversteigerung wurden im Quartal zu über 200 Mio. $ zurückgezahlt.
- Neue Acres erweitern das Bohrprogramm (über 156 Netto-Orte allein durch Paloma).
