thesis: >-
  Federated Hermes verwaltet 911,6 Mrd. $ (Rekord) und verdient sein Geld mit Gebühren auf diese Vermögen. Im 2. Quartal 2026
  stieg der Umsatz um 18 % auf 502,8 Mio. $, der Gewinn je Aktie auf 1,38 $ (Vorjahr 1,16 $). Die Bilanz ist fast schuldenfrei
  (Anleihe 350 Mio. $ zu 3,29 % bis 2032, Kreditlinie 350 Mio. $ ungenutzt, Zinsdeckung 52 zu 1). Die Schwäche: Rund die Hälfte des
  Umsatzes kommt aus Geldmarktfonds, deren Erträge an Zinsen und Gebühren-Verzichten hängen. Für Vermögensverwalter taugt
  EV/EBITDA nur eingeschränkt, deshalb gilt der Vergleich mit Vorsicht.
