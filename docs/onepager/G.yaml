  label: WEITERVERFOLGEN
  tone: ok
  text: Vorschlag des Agenten, Entscheidung durch Konstantin. Wachsender Umsatz und Gewinn, Prognose angehoben, mäßige Schulden; der Cashflow im 1. Halbjahr war schwach (Betriebskapital), und die Kernsparte wächst kaum.
  legend: Was bedeutet WEITERVERFOLGEN? Die Firma besteht den Filter und die Prüfung der Unterlagen zeigt kein Ausschlussmerkmal. Sie kommt in die engere Beobachtung; ein Kauf folgt nur nach den Stufe-4-Regeln und deiner Entscheidung. Es ist weder eine Kauf- noch eine Verkaufsempfehlung.
thesis: Genpact übernimmt Geschäftsprozesse für Konzerne (Finanzen, Kundendienst, Daten) und baut sein Technologiegeschäft aus. Im 2. Quartal 2026 stieg der Umsatz um 7,1 % auf 1.343 Mio. $; die Sparte Advanced Technology Solutions (27 % des Umsatzes) wuchs um 24 %, die Kernsparte Core Business Services (73 %) um 1,9 %. Das Betriebsergebnis stieg um 7,5 % auf 193 Mio. $, der Gewinn je Aktie um 15 % auf 0,86 $. Die Firma hob die Prognose für den bereinigten Gewinn je Aktie auf mindestens +12 % an. Der operative Cashflow des 1. Halbjahrs fiel auf 48,9 Mio. $ (Vorjahr 217,8), vor allem durch Forderungen, weniger Kundenvorauszahlungen und höhere Steuer- und Personalzahlungen. Der freie Cashflow der letzten zwölf Monate liegt bei rund 572 Mio. $ (10,0 % des Börsenwerts laut Archivkurs). Die Nettoschulden betragen rund 663 Mio. $; im April wurden die 2021-Anleihen von 350 Mio. $ zurückgezahlt (Tilgung langfristiger Schulden im Halbjahr insgesamt 363,3 Mio. $); im selben Halbjahr flossen 350 Mio. $ aus fälligen kurzfristigen Anlagen zu.
