thesis: Lindsay baut Bewässerungsanlagen (Irrigation) und Straßensicherheits-Produkte (Infrastruktur). Im 3. Quartal (März bis Mai 2026) sank der Umsatz um 5 % auf 160,8 Mio. $, das Betriebsergebnis um 22 % auf 18,5 Mio. $; Nordamerika-Bewässerung -11 % (schwache Rohstoffpreise, gedämpfte Stimmung der Landwirte), Brasilien schwach, Infrastruktur +8 %. In den ersten neun Monaten betrug das Betriebsergebnis 51,1 Mio. $ nach 76,8; der freie Cashflow der letzten zwölf Monate liegt bei rund 45 Mio. $ (3,7 % des Börsenwerts laut Archivkurs) nach 90 Mio. $ im Geschäftsjahr 2025. Die Firma hat Nettokasse von rund 40 Mio. $ und kaufte im Geschäftsjahr bisher für 80,7 Mio. $ eigene Aktien zurück. Ein großes Bewässerungsprojekt in Nahost/Nordafrika (MENA) läuft planmäßig und hebt den Auftragsbestand auf 136,1 Mio. $.
