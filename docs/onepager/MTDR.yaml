  label: ZURÜCKSTELLEN
  tone: warn
  text: Vorschlag des Agenten, Entscheidung durch Konstantin. Rekordförderung und Cashflow, aber eine Zukaufswelle (1,3 Mrd. $ im 1. Halbjahr, dazu Paloma 1,255 Mrd. $ am 01.10.) lässt die Schulden von 3,4 auf 4,2 Mrd. $ steigen, mit Paloma auf rund 5,5 Mrd. $; der Archiv-Cashflow gilt als ungeprüft.
  legend: 'Was bedeutet ZURÜCKSTELLEN? Die Firma besteht den Filter und bleibt auf der Liste, ist aber noch nicht reif für eine Entscheidung: Wir warten auf ein benanntes Ereignis (hier: Quartalsbericht Q3 2026 mit Paloma und Ridge Runner und die Schuldenentwicklung danach) und rechnen dann neu. Es ist weder eine Kauf- noch eine Verkaufsempfehlung.'
thesis: Matador fördert Öl und Gas im Delaware-Becken (Permian) und betreibt Midstream (San Mateo, zu 51 %). Im 2. Quartal 2026 erreichte die Ölförderung mit 126.106 Fass am Tag einen Rekord; die Prognose für das Ölwachstum 2026 wurde von 4 auf 7 % angehoben, die Reserven stiegen auf 703 Mio. BOE (+5 %). Der operative Cashflow betrug im Quartal 937 Mio. $, der bereinigte freie Cashflow 303 Mio. $. Daneben kaufte Matador im 1. Halbjahr Rechte und Midstream für 1,27 Mrd. $ (Bundespacht-Versteigerung, Cardinal Midstream) und am 01.10.2026 Paloma Permian für 1,255 Mrd. $ bar; Ridge Runner (13.600 Acres) soll im Oktober folgen. Die langfristigen Schulden stiegen von 3,40 auf 4,22 Mrd. $ (30.06.), mit Paloma auf rund 5,5 Mrd. $ (Agent, grob). Der freie Cashflow der letzten zwölf Monate vor Zukäufen liegt bei rund 569 Mio. $ (8,8 % des Börsenwerts); nach Zukäufen wäre er negativ.
