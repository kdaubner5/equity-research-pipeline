thesis: >-
  Sylvamo stellt Büro- und Druckpapier (unbeschichtetes Feinpapier) in Lateinamerika, Europa und den USA her. Auf den Zahlen der
  Geschäftsjahre ist die Firma billig (EV/EBITDA 5,1, Platz 2 von 51) und der freie Cashflow war im Dreijahresmittel hoch (rund
  195 Mio. $, 13,4 % des Börsenwerts). 2026 bricht das ab: Die Lieferung aus dem International-Paper-Werk Riverdale endete Ende April,
  das Werk Eastover steht wegen Investitionen länger still, Zölle und Energiekosten belasten. Das Segment-Betriebsergebnis (Größe der Firma) fiel im
  1. Halbjahr auf -1 Mio. $ (Vorjahr 74; Ergebnis vor Steuern -5 nach +53), der freie Cashflow lag bei -82 Mio. $. Die Nettoschulden stiegen seit Dezember von 718 auf
  841 Mio. $ (rund 2,3 Mal bereinigtes EBITDA nach Agent-Rechnung; Stufe-1-Grenze 2,5). Das Management erwartet ein deutlich besseres
  zweites Halbjahr; das ist eine Erwartung, kein Beleg.
