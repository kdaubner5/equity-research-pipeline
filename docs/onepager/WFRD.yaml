thesis: >-
  Weatherford liefert Ausrüstung und Dienstleistungen für Öl- und Gasbohrungen (Bohren, Komplettierung, Förderung), vor allem außerhalb
  der USA. Das 2. Quartal 2026 war schwächer: Umsatz 1.105 Mio. $ (-8 % zum Vorjahr), Betriebsergebnis 107 Mio. $ (-55 %), Nettogewinn 39 Mio. $
  (-71 %). Die Firma nennt Störungen durch den Konflikt im Nahen Osten (Iran) und erwartet eine schrittweise Erholung. Die Bilanz ist solide:
  Nettoschulden 343 Mio. $, 0,34 Mal bereinigtes EBITDA (Vorjahr 0,49); der freie Cashflow der letzten zwölf Monate liegt bei rund 526 Mio. $
  (8,7 % des Börsenwerts nach Agent-Rechnung). Strukturell ändert sich viel: Zukauf von NCS Multistage (Aktien und Bar), Umzug des Rechtssitzes
  von Irland nach Delaware (Aktionäre stimmten am 03.09.2026 zu) und ein Wechsel des Chefbuchhalters.
