  legend: "Was bedeutet WEITERVERFOLGEN? Die Firma besteht den Filter und die Prüfung der Unterlagen zeigt kein Ausschlussmerkmal. Sie kommt in die engere Beobachtung; ein Kauf folgt nur nach den Stufe-4-Regeln und deiner Entscheidung. Es ist weder eine Kauf- noch eine Verkaufsempfehlung."
thesis: >-
  Visteon baut Cockpit-Elektronik für Autohersteller (Anzeigen, Kombiinstrumente, Bordcomputer). Auf den Geschäftsjahren ist die Firma
  billig (EV/EBITDA 4,6, Platz 2 von 17) und hat mehr Kasse als Schulden: zum 30.06.2026 Kasse 650 Mio. $, Schulden 299 Mio. $,
  also 351 Mio. $ Nettokasse. Der freie Cashflow lag 2024 und 2025 bei rund 290 und 277 Mio. $. Das Jahr 2026 ist schwächer:
  Das bereinigte EBITDA fiel im 1. Halbjahr um 16 % auf 220 Mio. $, der freie Cashflow lag bei -18 Mio. $, und die Firma erwartet
  für das Gesamtjahr rund 475 Mio. $ EBITDA und 150 Mio. $ freien Cashflow. Am 23.07. startete ein beschleunigter Aktienrückkauf
  über 200 Mio. $ (rund 8 % des Börsenwerts); danach schrumpft die Nettokasse auf grob 150 Mio. $.
