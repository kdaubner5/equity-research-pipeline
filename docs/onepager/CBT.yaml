not_checked: "Die Peer-Gruppe Chemicals (22 Firmen) mischt Spezialchemie, Düngemittel, Kohle-Chemie und Schmierstoffe; sie passt nur begrenzt zu einem Rußhersteller. Net Debt/EBITDA (1,4) ist die Angabe der Firma, nicht die Stufe-1-Rechnung; das EV/EBIT ist mit dem Betriebsergebnis laut XBRL gerechnet. Die Gesamtschulden sind eine Summe aus drei XBRL-Posten (langfristig 828, kurzfristig 261, Kurzfrist-Kredite 184 Mio. $) und nicht aus der Bilanz nachgerechnet. Die Höhe der Umbau- und Pensionskosten (certain items) und die Einzelheiten der Kundenverträge 2026 sind offen. Der Kurs vom 23.09. liegt vor dem Chefwechsel (01.10.). Der heutige Kurs ist offen. Entwurf des Agenten, ohne die Prompts Bear/Bull/Synthese."
peer_note: "Vollständige Peer-Gruppe aus dem Zwischenspeicher neu gerechnet (Export vom 12.10.2026); 1 Firma fehlt wegen Datenfehlers (SSL). Große Gruppe: gezeigt ist ein Ausschnitt um CBT."
peer_summary: "Gegen die 22 Firmen der Peer-Gruppe: EV/EBITDA 6,4 gegen Median 11,0 (Platz 3 von 22), FCF-Rendite 9,8 % gegen Median 4,1 % (Platz 4 von 21). Archivwerte der Geschäftsjahre bis 2025; auf den letzten zwölf Monaten liegt die FCF-Rendite bei etwa 6,9 %. Die Gruppe passt nur begrenzt."
