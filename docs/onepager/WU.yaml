  legend: 'Was bedeutet ZURÜCKSTELLEN? Die Firma besteht den Filter und bleibt auf der Liste, ist aber noch nicht reif für eine Entscheidung: Wir warten auf ein benanntes Ereignis (hier: Entscheidung zum Intermex-Kauf (Kalifornien, Kartellfrist) und Quartalsbericht Q3 2026) und rechnen dann neu. Es ist weder eine Kauf- noch eine Verkaufsempfehlung.'
thesis: Western Union überweist Geld über Landesgrenzen (Filialen und digital) und bietet Verbraucherdienste. Im 2. Quartal 2026 sank der Umsatz um 1 % auf rund 1,0 Mrd. $; die Betriebsmarge fiel auf 13 % (bereinigt 15 %) nach 19 %; der Gewinn je Aktie sank auf 0,24 $ (bereinigt 0,31 $) nach 0,37 $ (0,42 $). Der Konzernchef nennt ausgebliebene Besserung im Filialgeschäft in Amerika und den verspäteten Abschluss des Kaufs von Intermex als Gründe. Der Kauf von Intermex (rund 500 Mio. $ bar plus Rückzahlung von Intermex-Schulden) wurde am 10.08.2025 vereinbart; am 13.08.2026 setzte Kalifornien seine Genehmigung aus, am 02.10.2026 wurde eine neue Kartellanmeldung nötig. Der freie Cashflow der letzten zwölf Monate liegt bei rund 565 Mio. $ (29,8 % des Börsenwerts laut Archivkurs); die Nettoschulden betragen rund 1,6 Mrd. $ (ohne kurzfristige Schulden und Mieten).
