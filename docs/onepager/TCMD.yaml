thesis: 'Tactile Medical stellt Geräte für Lymphödem- und Atemwegs-Therapie her (Flexitouch, AffloVest). Im 2. Quartal 2026 stieg der Umsatz um 9 % auf 85,7 Mio. $ (Lymphödem +12 %, Atemwege -7 %: „vorübergehende Lagerdynamik“ bei großen Händlern wegen der neuen AffloVest-Generation); die Bruttomarge lag bei 76 %, das bereinigte EBITDA stieg auf 11,4 Mio. $ (Vorjahr 7,7). Die Firma hat 69,9 Mio. $ Kasse und keine Schulden. Der operative Cashflow fiel im 1. Halbjahr auf 2,9 Mio. $ (Vorjahr 15,2), der freie Cashflow der letzten zwölf Monate liegt bei rund 27 Mio. $ (5,3 % des Börsenwerts), 2025 waren es 40 Mio. $. Die Umsatzprognose für 2026 wurde leicht auf 360 bis 366 Mio. $ gesenkt, das bereinigte EBITDA (49 bis 51 Mio. $) bestätigt.'
