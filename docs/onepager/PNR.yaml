verdict:
  label: ZURÜCKSTELLEN
  tone: warn
  text: Vorschlag des Agenten, Entscheidung durch Konstantin. Ein Lagerabbau im Pool-Geschäft (rund 170 Mio. $) drückte den Umsatz im 2. Quartal um 17 %, und der Kauf von Taco (1,425 Mrd. $, Abschluss 4. Quartal 2026) bringt neue Schulden; die Prognose 2026 steht.
  legend: 'Was bedeutet ZURÜCKSTELLEN? Die Firma besteht den Filter und bleibt auf der Liste, ist aber noch nicht reif für eine Entscheidung: Wir warten auf ein benanntes Ereignis (hier: Abschluss des Taco-Kaufs (4. Quartal 2026) und Quartalsbericht Q3 2026) und rechnen dann neu. Es ist weder eine Kauf- noch eine Verkaufsempfehlung.'
thesis: Pentair liefert Wasserprodukte (Pumpen, Filter, Pool-Ausrüstung). Im 2. Quartal 2026 sank der Umsatz um 17 % auf 933 Mio. $, weil der Handel im Pool-Geschäft Lager um rund 170 Mio. $ abbaute (Firma am 14.07. vorab mitgeteilt); das Betriebsergebnis betrug 167 Mio. $ nach 218, der bereinigte Gewinn je Aktie 1,14 $ nach 1,39 $. Darin stecken rund 35 Mio. $ Rückerstattung auf frühere Zölle (IEEPA). Die Prognose für 2026 (bereinigter Gewinn je Aktie 4,60 bis 4,80 $) bleibt. Der freie Cashflow im 2. Quartal lag bei 553 Mio. $, im 1. Halbjahr bei 467 Mio. $; der der letzten zwölf Monate bei rund 673 Mio. $ (7,6 % des Börsenwerts laut Archivkurs). Am 27.07.2026 vereinbarte Pentair den Kauf von Taco Group (1,425 Mrd. $), Abschluss im 4. Quartal 2026; finanziert über Kasse und Kredite (1,4 Mrd. $ Term Loans am 01.09. zugesagt). Die Schulden betragen derzeit rund 1,6 Mrd. $.
