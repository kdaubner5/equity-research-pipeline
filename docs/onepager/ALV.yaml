bear:
- 'Türkei-Schließung: rund 142 Mio. $ Aufwand, davon rund 129 Mio. $ Auszahlungen (Abfindungen); ein Teil davon fließt erst in den nächsten Quartalen ab.'
- Die Prognose rechnet mit 2,5 % weniger Fahrzeugproduktion weltweit; organisches Wachstum nur rund 0 %.
- Betriebskapital-Abbau von 240 Mio. $ im Quartal ist einmalig und stützt Cashflow und 12-Monats-Zahl.
- Zölle, Lieferketten und Rohstoffpreise wirken (Firmenangabe „begrenzt“); Kunden-Ausgleichszahlungen hängen von Verhandlungen ab.
- In Amerika bleibt das Wachstum deutlicher hinter der Fahrzeugproduktion zurück als in EMEA (Finanzbericht); der President Americas geht.
bull:
