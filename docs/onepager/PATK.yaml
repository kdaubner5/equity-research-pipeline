not_checked: "Die Zahlen von LCI Industries, die genauen Fusionsbedingungen jenseits der gelesenen Stellen (Rücktritts- und Anpassungsklauseln), die Bewertung des Tauschverhältnisses und die Gründe für den Kursrückgang seit Juni sind nicht ausgewertet. Die Peer-Gruppe (Bekleidung, Möbel, Schuhe) passt kaum zu einem Zulieferer für Wohnmobile, Boote und Fertighäuser. Net Debt/EBITDA 3,0 ist die Angabe der Firma nach dem Kreditvertrag und nicht die Stufe-1-Rechnung; das EV/EBIT ist ungefähr (Schulden aus der Pressemitteilung gerundet, Kasse nicht gelesen). Die Kandidatenliste vermerkt für PATK: Daten veraltet (Stand 1. Quartal des Geschäftsjahres); die hier genutzten Zahlen stammen aus dem 10-Q Q2 2026. Der heutige Kurs ist offen. Entwurf des Agenten, ohne die Prompts Bear/Bull/Synthese."
peer_note: "Vollständige Peer-Gruppe aus dem Zwischenspeicher neu gerechnet (Export vom 12.10.2026); in der Gruppe fehlen keine Firmen wegen Datenfehlern. Die Gruppe passt kaum (Bekleidung, Möbel, Schuhe)."
