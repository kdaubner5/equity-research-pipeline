  legend: Was bedeutet WEITERVERFOLGEN? Die Firma besteht den Filter und die Prüfung der Unterlagen zeigt kein Ausschlussmerkmal. Sie kommt in die engere Beobachtung; ein Kauf folgt nur nach den Stufe-4-Regeln und deiner Entscheidung. Es ist weder eine Kauf- noch eine Verkaufsempfehlung.
thesis: Academy ist eine Sport- und Outdoor-Kette mit 327 Filialen (Geschäftsjahr bis Ende Januar). Im 2. Quartal 2026 stieg der Umsatz um 3,0 % auf 1.647 Mio. $ (vergleichbare Fläche -0,4 %, Online +12,8 %); der Gewinn je Aktie stieg um 17 % auf 2,17 $. Im 2. Quartal erhielt die Firma 83,7 Mio. $ Rückerstattung auf Zölle (IEEPA; der Supreme Court hatte diese Zölle im Februar 2026 gekippt), gebucht als Minderung der Warenkosten; das hebt die Bruttomarge-Prognose und den Cashflow, ist aber einmalig. Der freie Cashflow der letzten zwölf Monate liegt bei rund 331 Mio. $ (ohne Rückerstattung rund 248 Mio. $), die Nettoschulden bei 196 Mio. $ (ohne Mieten). Im ersten Halbjahr kaufte die Firma für 182 Mio. $ eigene Aktien zurück. Der CEO nennt den Konsum „unter Druck, besonders bei Haushalten mit niedrigem Einkommen“.
