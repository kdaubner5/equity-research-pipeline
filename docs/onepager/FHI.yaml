not_checked: "Die Peer-Gruppe (8 Firmen) passt nur eingeschränkt: Sie enthält neben Vermögensverwaltern einen Investmentbank-Berater (Moelis), eine Beteiligungsholding (Icahn Enterprises) und einen Kreditfonds (Hercules); deren FCF-Renditen von 47 bis 49 % sind nicht vergleichbar. In der Archivgruppe fehlen 4 Firmen wegen Datenfehlern (OTF, RA, URG, VOYA). Das Archiv trägt für Stufe 1 die Datenmarke `debt_component_missing_defaulted_zero` (ein Teil der Schulden fehlte und wurde auf 0 gesetzt); grob nachgerechnet passt der Wert -0,43 zu Anleihe 348,4 minus Kasse 582,5 zum 31.12.2025, ein Fehler ist nicht erkennbar. Die FCF-Rendite des Archivs (8,9 %) weicht von der Agent-Rechnung aus SEC-Zahlen (Dreijahresmittel 2023 bis 2025: 7,2 %) ab; die Ursache ist nicht untersucht. Der heutige Kurs, die Peer-Drittelgrenze, die Aufteilung der Geldmarkt-Erträge nach Zinssatz und die Details der Gebühren-Verzichte sind offen. Entwurf des Agenten, ohne die Prompts Bear/Bull/Synthese."
peer_note: "Vollständige Peer-Gruppe aus dem Zwischenspeicher neu gerechnet (Export vom 12.10.2026); 4 Firmen fehlen wegen Datenfehlern (OTF, RA, URG, VOYA; laut Hinweis des Exportlaufs vom 12.10.2026). Die FCF-Renditen der Kreditfonds und Holdings (47 bis 49 %) verzerren den Median."
peer_summary: "Gegen die 8 Firmen der Peer-Gruppe: EV/EBITDA 7,5 gegen Median 13,1 (Platz 1 von 8, die günstigste), FCF-Rendite 8,9 % gegen Median 9,3 % (Platz 5 von 8, knapp darunter). Vorsicht: Die Gruppe ist klein und gemischt; Vermögensverwalter werden besser an Gewinn und Vermögen gemessen als an EV/EBITDA."
