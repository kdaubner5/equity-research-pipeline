thesis: Maximus betreibt Behördendienstleistungen für Regierungen (Gesundheit und Sozialleistungen; Geschäftsjahr bis 30.09.). Im 3. Quartal 2026 sank der Umsatz erwartungsgemäß auf 1,28 Mrd. $ (Vorjahr 1,35 Mrd. mit Katastropheneinsätzen und Klinik-Spitzen); die Betriebsmarge stieg auf 12,6 %, der Gewinn je Aktie auf 1,95 $ (bereinigt 2,22 $). Ein Großkunde im Bundesgeschäft änderte seinen Vertrag befristet vom 01.07. bis 31.12.2026; das kostet rund 0,35 $ Gewinn je Aktie pro Quartal bis zum 1. Quartal des Geschäftsjahrs 2027, und die Prognose für den bereinigten Gewinn je Aktie 2026 sank auf 7,90 bis 8,20 $. Der freie Cashflow soll 425 bis 475 Mio. $ betragen; der der letzten zwölf Monate liegt bei rund 433 Mio. $ (15,4 % des Börsenwerts laut Archivkurs). Die Schulden stiegen am 27.05.2026 um 325 Mio. $ (Term Loan B) auf 1,64 Mrd. $, die Kasse liegt bei 57 Mio. $.
