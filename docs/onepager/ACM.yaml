  legend: 'Was bedeutet ZURÜCKSTELLEN? Die Firma besteht den Filter und bleibt auf der Liste, ist aber noch nicht reif für eine Entscheidung: Wir warten auf ein benanntes Ereignis (hier: Fertigstellung des Bauprojekts (laut Firma im 2. Quartal FY27) und Jahresbericht für das Geschäftsjahr bis 30.09.2026) und rechnen dann neu. Es ist weder eine Kauf- noch eine Verkaufsempfehlung.'
thesis: 'AECOM plant, berät und betreut große Infrastrukturprojekte (Geschäftsjahr bis 30.09.). Im 3. Quartal (April bis Juni 2026) sank der Umsatz um 14 % auf 3,59 Mrd. $; das Betriebsergebnis betrug -76 Mio. $, weil ein 2019 vergebenes Construction-Management-Bauprojekt 337 Mio. $ Vorsteuerverlust brachte: Subunternehmer arbeiten langsamer, die Fertigstellung rutscht auf das 2. Quartal FY27, die Firma verfolgt Nachforderungen, die „mehrere Jahre und Rechtsstreit“ dauern können. Ohne dieses Projekt nennt die Firma eine bereinigte Marge von 16,5 % und einen bereinigten Gewinn je Aktie von 1,49 $ (+11 %). Der Auftragsbestand ist mit 27,8 Mrd. $ (+13 %) ein Rekord. Die Prognose für den freien Cashflow 2026 wurde auf rund 300 Mio. $ gesenkt. Die Nettoschulden stiegen von 754 Mio. $ (30.06.2025) auf 1.732 Mio. $.'
