thesis: Accel stellt Spielautomaten in Kneipen und Geschäften auf (hauptsächlich Illinois) und betreibt eine Rennbahn mit Kasino (Fairmount Park). Im 2. Quartal 2026 stieg der Umsatz um 10 % auf 368 Mio. $ (Rekord), an 4.676 Standorten mit 29.281 Geräten; der Nettogewinn stieg um 72 % auf 13 Mio. $, das bereinigte EBITDA um 11 % auf 59 Mio. $. Der freie Cashflow der letzten zwölf Monate liegt bei rund 79 Mio. $ (8,7 % des Börsenwerts laut Archivkurs); im 2. Quartal drückte der Kauf einer Steuergutschrift (17 Mio. $) den Cashflow. Die Nettoschulden betragen 318 Mio. $ (Firmenangabe). Chancen kommen aus Chicago, wo die Genehmigungen laufen (17 oder 44 % der bisher genehmigten Standorte sind Accel-Standorte).
