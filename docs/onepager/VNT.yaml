  legend: Was bedeutet WEITERVERFOLGEN? Die Firma besteht den Filter und die Prüfung der Unterlagen zeigt kein Ausschlussmerkmal. Sie kommt in die engere Beobachtung; ein Kauf folgt nur nach den Stufe-4-Regeln und deiner Entscheidung. Es ist weder eine Kauf- noch eine Verkaufsempfehlung.
thesis: Vontier liefert Technik für Tankstellen und Mobilität (Zapfsäulen, Zahlungs- und Umwelttechnik). Im 2. Quartal 2026 sank der Umsatz um 2,2 % auf 757 Mio. $ (Kerngeschäft -0,2 %, Lieferzeitpunkte); das Betriebsergebnis stieg um 7,6 % auf 147 Mio. $ (Marge 19,4 %, bereinigt 23,0 %). Der Nettogewinn fiel auf 27 Mio. $ (Vorjahr 92) wegen eines vorläufigen Verlusts von 86,2 Mio. $ aus dem Verkauf von Teletrac Navman (30.06.2026; Erlös laut Firma 85 Mio. $ bar, 99,8 Mio. $ Verkäuferdarlehen, 23,4 Mio. $ Minderheitsbeteiligung). Die Prognose für den bereinigten Gewinn je Aktie 2026 wurde auf 3,45 bis 3,55 $ angehoben. Der freie Cashflow der letzten zwölf Monate liegt bei rund 385 Mio. $ (8,7 % des Börsenwerts); die Nettoschulden betragen rund 1,63 Mrd. $ (davon 305 Mio. $ kurzfristige Kredite; Stufe-1-Wert 2,34, in der Grauzone).
