- 'Asien: Indien +20 Prozentpunkte über dem Markt, China mehr als 40 Prozentpunkte (55 % des China-Umsatzes mit chinesischen Herstellern).'
- Bester Quartalscashflow in einem 2. Quartal; freier operativer Cashflow 340 Mio. $ (mehr als verdoppelt).
- Verschuldungsgrad 1,2x (Firmenangabe); Dividende 0,87 $ je Quartal (+24 %).
- Türkei-Schließung soll ab 2027 rund 40 Mio. $ jährlich sparen.
