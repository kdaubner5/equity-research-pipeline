  label: "WEITERVERFOLGEN"
  tone: ok
  text: "Vorschlag des Agenten, Entscheidung durch Konstantin. Solide Bilanz und Cashflow, aber der bereinigte Gewinn sinkt (Reifen-Ruß-Verträge 2026) und Chef und Finanzchef wechseln gleichzeitig."
  legend: "Was bedeutet WEITERVERFOLGEN? Die Firma besteht den Filter und die Prüfung der Unterlagen zeigt kein Ausschlussmerkmal. Sie kommt in die engere Beobachtung; ein Kauf folgt nur nach den Stufe-4-Regeln und deiner Entscheidung. Es ist weder eine Kauf- noch eine Verkaufsempfehlung."
thesis: >-
  Cabot stellt Industrieruß für Reifen (Reinforcement Materials) sowie Spezialchemie und Batteriematerial (Performance Chemicals) her.
  Im 3. Quartal des Geschäftsjahres (Ende 30.06.2026) lag der bereinigte Gewinn je Aktie bei 1,67 $ nach 1,90 $; der ausgewiesene
  Gewinn war wegen Umbau- und Pensionskosten nur 0,12 $ je Aktie. Der Reifenbereich verdient je Tonne weniger (Verträge für das
  Kalenderjahr 2026), die Spezialchemie legt zu. Die Verschuldung liegt laut Firma bei 1,4 Mal EBITDA, die Liquidität bei
  1,3 Mrd. $; die Firma ersetzt Anleihen über 250 Mio. $ (3,40 %, fällig im September 2026) durch neue über 350 Mio. $ (4,95 %, bis 2029).
  Der freie Cashflow der letzten zwölf Monate liegt bei rund 281 Mio. $ (6,9 % des Börsenwerts nach Agent-Rechnung). Der Chef
  tritt zum 30.09. ab (Nachfolgerin: die Finanzchefin), die Stelle des Finanzchefs wird kommissarisch besetzt.
