not_checked: "Die Peer-Gruppe Financial Services (grobe Gruppe, 16 Firmen) besteht aus Vermögensverwaltern, Kreditgebern und Börsendienstleistern; sie passt nur begrenzt zu einem Berichts-Software-Anbieter. Das Archiv trägt die Marken Grenzfall-Branche, grobe Vergleichsgruppe, Aktienzahl ungeprüft und für Stufe 1 die Datenmarke `debt_component_missing_defaulted_zero`; die Verschuldung 0,70 des Archivs stimmt mit der Angabe der Firma (0,7) überein. 11 Firmen der Gruppe fehlen wegen Datenfehlern (BFH, HIVE, NAVI, NNI, OMF, OPY, OTF, PRAA, RA, URG, VOYA). Das bereinigte EBITDA und die Nettoverschuldung sind Größen der Firma. Offen sind der heutige Kurs, die Abhängigkeit vom Börsengang- und Übernahmegeschäft und die Pensionslage nach der Abwicklung. Entwurf des Agenten, ohne die Prompts Bear/Bull/Synthese."
peer_note: "Vollständige Peer-Gruppe aus dem Zwischenspeicher neu gerechnet (Export vom 12.10.2026); 11 Firmen fehlen wegen Datenfehlern (BFH, HIVE, NAVI, NNI, OMF, OPY, OTF, PRAA, RA, URG, VOYA). Die Gruppe ist grob (Branchenebene) und mischt Vermögensverwalter, Kreditgeber und Börsendienstleister."
peer_summary: "Gegen die 16 Firmen der Peer-Gruppe: EV/EBITDA 6,4 gegen Median 11,0 (Platz 2 von 16), FCF-Rendite 8,0 % gegen Median 9,3 % (Platz 10 von 14). Archivwerte der Geschäftsjahre; 11 Firmen fehlen wegen Datenfehlern, die Gruppe ist grob. Einordnung nur mit Vorsicht."
