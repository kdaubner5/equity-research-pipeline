- 'First-Eagle-Kauf für rund 7,0 Mrd. $: 3,5 Mrd. $ Term Loan B plus rund 950 Mio. $ Anleihen plus 575 Mio. $ übernommene Anleihen (7,25 %); zusätzlich rund 4,45 Mrd. $ neue Kredite plus 575 Mio. $ übernommene Anleihen (Summe rund 5,0 Mrd. $, Agent) gegen heutige Schulden von 968 Mio. $.'
