  label: ZURÜCKSTELLEN
  tone: warn
  text: 'Vorschlag des Agenten, Entscheidung durch Konstantin. Das Ergebnis ist stark vom Düngerpreis abhängig und steht nach 2024 wieder hoch (Betriebsergebnis 2024: 90, letzte 12 Monate 190 Mio. $); die Archiv-FCF-Zahl gilt als ungeprüft, die Branche ist zyklisch, und die Führung wechselte im Juni.'
  legend: 'Was bedeutet ZURÜCKSTELLEN? Die Firma besteht den Filter und bleibt auf der Liste, ist aber noch nicht reif für eine Entscheidung: Wir warten auf ein benanntes Ereignis (hier: Quartalsbericht Q3 2026 (nach der Stillstandsrevision in East Dubuque) und Düngerpreise) und rechnen dann neu. Es ist weder eine Kauf- noch eine Verkaufsempfehlung.'
thesis: 'CVR Partners stellt Ammoniak und Harnstoff-Ammonnitrat-Dünger (UAN) her (u. a. im Werk East Dubuque), eine Personengesellschaft (LP) mit 10,57 Mio. Anteilen. Im 2. Quartal 2026 stiegen Umsatz und Ergebnis kräftig: Umsatz 202 Mio. $ (Vorjahr 169), Nettogewinn 78 Mio. $ (39), je Anteil 7,33 $; die Ammoniak-Auslastung lag bei 99 %. Die Firma verweist auf knappes weltweites Stickstoffangebot durch geopolitische Konflikte, das die Preise stützt. Für das 2. Quartal wurden 6,08 $ je Anteil als Ausschüttung beschlossen (Zahltag 17.08.2026). Das Betriebsergebnis der letzten zwölf Monate beträgt 190 Mio. $ (2024: 90), der freie Cashflow rund 145 Mio. $ (10,7 % des Börsenwerts). Die Nettoschulden betragen rund 432 Mio. $ (6,125-%-Anleihen 550 Mio. $ bis Juni 2028). Für August 2026 war eine sechswöchige Stillstandsrevision in East Dubuque geplant; am 18.06.2026 schied Mark Pytosh als Chef von CVR Energy und der Geschäftsführung von CVR Partners aus.'
