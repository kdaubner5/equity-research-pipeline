thesis: 'Tennant baut Reinigungsmaschinen für Gewerbe und Industrie (Scheuersaugmaschinen, Roboter). Im 2. Quartal 2026 stieg der Umsatz um 1,7 % auf 324 Mio. $, der Auftragseingang um 6,6 % auf 339,5 Mio. $; aber das bereinigte EBITDA fiel um 31 % auf 35,3 Mio. $ (Marge 10,9 % nach 16,0 %): „Rest-Ineffizienzen nach der ERP-Einführung in Nordamerika und Preis- und Kostendruck in EMEA“. Der Gewinn je Aktie sank auf 0,44 $ (Vorjahr 1,08), der Halbjahres-Nettogewinn auf 7,8 Mio. $ (33,3). Die Prognose für das bereinigte EBITDA 2026 wurde auf 155 bis 170 Mio. $ gesenkt, die Umsatzprognose auf 1,27 bis 1,31 Mrd. $ angehoben. Der operative Cashflow war im 1. Halbjahr -26,2 Mio. $ (Vorjahr +22,1), der freie Cashflow der letzten zwölf Monate liegt bei -2,7 Mio. $. Die Nettoschulden stiegen auf 282 Mio. $; Finanzchefin Fay West will in den Ruhestand (frühestens 02.04.2027).'
