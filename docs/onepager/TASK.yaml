not_checked: "Die Peer-Gruppe ist grob (Branchenebene statt Unterbranche, 14 Firmen) und mischt Telekom, Beratung, Personal und Außenwerbung; die Passung zu einem Auslagerungs-Dienstleister ist begrenzt. Das Archiv trägt die Marke Aktienzahl ungeprüft. Die Nettoschulden sind aus den langfristigen Schulden nach Emissionskosten (468,7 Mio. $) minus Kasse gerechnet; ein kurzfristiger Teil der Schulden ist nicht enthalten, die Verschuldung liegt damit eher etwas höher. Das bereinigte EBITDA stammt von der Firma (Definition nicht geprüft). Offen sind der heutige Kurs, Kunde A (namentlich nicht genannt) und die Einordnung von KI-Risiken. Entwurf des Agenten, ohne die Prompts Bear/Bull/Synthese."
