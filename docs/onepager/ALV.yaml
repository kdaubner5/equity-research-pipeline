  label: WEITERVERFOLGEN
  tone: ok
  text: Vorschlag des Agenten, Entscheidung durch Konstantin. Der Gewinnrückgang kommt aus dem einmaligen Umbau in der Türkei (142 Mio. $); das bereinigte Ergebnis steigt, die Schulden sinken, die Prognose 2026 steht. Autoindustrie und Zölle bleiben Risiken.
  legend: Was bedeutet WEITERVERFOLGEN? Die Firma besteht den Filter und die Prüfung der Unterlagen zeigt kein Ausschlussmerkmal. Sie kommt in die engere Beobachtung; ein Kauf folgt nur nach den Stufe-4-Regeln und deiner Entscheidung. Es ist weder eine Kauf- noch eine Verkaufsempfehlung.
thesis: Autoliv baut Airbags, Gurte und Lenkräder für Autohersteller. Im 2. Quartal 2026 stieg der Umsatz um 3,3 % auf 2.803 Mio. $ (organisch +1,0 %, in einem leicht fallenden Weltmarkt); der bereinigte Betriebsgewinn stieg um 7,3 % auf 270 Mio. $ (9,6 % Marge). Das berichtete Betriebsergebnis fiel dagegen um 22 % auf 192 Mio. $, weil die Firma am 08.05.2026 die Schließung ihrer Werke in der Türkei beschloss (Gesamtaufwand rund 142 Mio. $, davon rund 129 Mio. $ Auszahlungen, rund 2.200 Stellen; erwartete Ersparnis rund 40 Mio. $ im Jahr ab 2027). Der operative Cashflow im 2. Quartal lag bei 434 Mio. $ (Vorjahr 277), auch dank 240 Mio. $ Abbau von Betriebskapital. Der freie Cashflow der letzten zwölf Monate liegt bei rund 757 Mio. $ (9,0 % des Börsenwerts laut Archivkurs). Die Nettoschulden betragen 1.695 Mio. $ (Verschuldungsgrad laut Firma 1,2x). Prognose 2026 bestätigt (bereinigte Marge 10,5 bis 11 %, operativer Cashflow rund 1,2 Mrd. $).
