verdict:
  label: ZURÜCKSTELLEN
  tone: warn
  text: Vorschlag des Agenten, Entscheidung durch Konstantin. Solides Geschäft mit mäßiger Verschuldung, aber das Betriebsergebnis sinkt seit 2023, 163,8 Mio. $ gingen in den Petersen-Kauf, und im 3. Quartal kommen 22 bis 30 Mio. $ Aufwand für zwei eingestellte Marken.
  legend: 'Was bedeutet ZURÜCKSTELLEN? Die Firma besteht den Filter und bleibt auf der Liste, ist aber noch nicht reif für eine Entscheidung: Wir warten auf ein benanntes Ereignis (hier: Quartalsbericht Q3 2026 (mit den Aufwendungen für Boxer und Dixie Chopper) und erste Zahlen zu Petersen) und rechnen dann neu. Es ist weder eine Kauf- noch eine Verkaufsempfehlung.'
thesis: 'Alamo baut Maschinen für Straßen- und Grünpflege und für die Landwirtschaft (Industrial Equipment und Vegetation Management). Im 2. Quartal 2026 stieg der Umsatz um 7,6 % auf 450,7 Mio. $, der bereinigte Gewinn je Aktie um 7 % auf 2,82 $; der Industrie-Bereich wuchs um 12,8 %, die Grünpflege nur um 0,4 %. Im Januar kaufte die Firma Petersen Industries für rund 163,8 Mio. $ (Kasse und Kredit); Ende Mai wurde der Kreditvertrag erneuert (400 Mio. $ Revolver, 202,5 Mio. $ Term Loan). Im September stellte sie die Marken Boxer (7 bis 10 Mio. $ Aufwand) und Dixie Chopper (15 bis 20 Mio. $, davon 1 bis 4 Mio. $ Auszahlung) ein. Das Betriebsergebnis der letzten zwölf Monate beträgt 148 Mio. $ (2023: 198), der freie Cashflow rund 135 Mio. $ (6,8 % des Börsenwerts).'
