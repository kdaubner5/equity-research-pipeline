verdict:
  label: "WEITERVERFOLGEN"
  tone: ok
  text: "Vorschlag des Agenten, Entscheidung durch Konstantin. Billig und cashstark, aber seit der 333-Mio.-$-Sonderdividende mit neuen Schulden und abbremsendem Wachstum."
  legend: "Was bedeutet WEITERVERFOLGEN? Die Firma besteht den Filter und die Prüfung der Unterlagen zeigt kein Ausschlussmerkmal. Sie kommt in die engere Beobachtung; ein Kauf folgt nur nach den Stufe-4-Regeln und deiner Entscheidung. Es ist weder eine Kauf- noch eine Verkaufsempfehlung."
thesis: >-
  TaskUs übernimmt für Technologiekunden Aufgaben wie Inhaltsmoderation, Kundendienst und KI-Datenarbeit, vor allem aus den Philippinen
  und Indien. Auf den Zahlen der Geschäftsjahre ist die Firma billig (EV/EBITDA 3,9, Platz 1 von 14) und erzeugt freien Cashflow von
  rund 12 % des Börsenwerts. Wichtig: Stufe 1 sah nur 2025 (Nettoschulden fast null, 0,15 Mal EBITDA). Im März 2026 nahm TaskUs einen
  Kredit über 500 Mio. $ auf und zahlte davon und aus der Kasse eine Sonderdividende von 3,65 $ je Aktie (332,8 Mio. $). Danach liegen die
  Nettoschulden bei rund 288 Mio. $ (nach Agent-Rechnung rund 1,2 Mal bereinigtes EBITDA). Das Wachstum bremst: Ausblick für das
  3. Quartal nur +0,8 %, bereinigte EBITDA-Marge rund 19 % nach 21 % in 2025.
