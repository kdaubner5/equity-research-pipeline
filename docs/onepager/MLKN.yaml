thesis: MillerKnoll stellt Büro- und Wohnmöbel her (Marken u. a. Herman Miller und Knoll; Geschäftsjahr bis Ende Mai). Im 1. Quartal des Geschäftsjahrs 2027 (Juni bis August 2026) sank der Umsatz um 3,4 % auf 923 Mio. $, die Bestellungen stiegen um 3,2 %; die Bruttomarge stieg auf 41,7 % (+3,2 Prozentpunkte), auch durch rund 10 Mio. $ Rückerstattung auf frühere IEEPA-Zölle (laut Firma ca. 10 Mio. $ netto im Betriebsergebnis, +0,11 $ Gewinn je Aktie; weitere Erstattungsansprüche werden verfolgt). Der bereinigte Gewinn je Aktie stieg um 18 % auf 0,53 $. Seit 30.06.2026 führt Jeff Stutz die Firma als Interims-Konzernchef, nachdem Andi Owen in den Ruhestand ging. Die Umsatzprognose für FY27 wurde auf 3,88 bis 4,03 Mrd. $ gesenkt (vorher 3,93 bis 4,13), die Gewinnprognose (1,85 bis 2,15 $) blieb. Die Nettoschulden betragen 1,13 Mrd. $; das Verhältnis Net Debt/EBITDA nach dem Kreditvertrag liegt bei 2,75x. Der freie Cashflow der letzten zwölf Monate beträgt rund 116 Mio. $ (8,5 % des Börsenwerts).
