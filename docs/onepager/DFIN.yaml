verdict:
  label: "WEITERVERFOLGEN"
  tone: ok
  text: "Vorschlag des Agenten, Entscheidung durch Konstantin. Wachsende Software-Erlöse, steigende Marge, geringe Schulden und kräftige Aktienrückkäufe; Risiko: das Geschäft hängt an Kapitalmarkt-Aktivität."
  legend: "Was bedeutet WEITERVERFOLGEN? Die Firma besteht den Filter und die Prüfung der Unterlagen zeigt kein Ausschlussmerkmal. Sie kommt in die engere Beobachtung; ein Kauf folgt nur nach den Stufe-4-Regeln und deiner Entscheidung. Es ist weder eine Kauf- noch eine Verkaufsempfehlung."
thesis: >-
  DFIN liefert Software und Dienstleistungen für Berichte von Börsenfirmen und Fonds (zum Beispiel ActiveDisclosure) sowie Druck
  und Versand. Im 2. Quartal 2026 stieg der Umsatz um 2,8 % auf 224,2 Mio. $, die Software-Erlöse um 7,8 % auf einen Rekord von
  99,4 Mio. $, das bereinigte EBITDA um 7,9 % auf 82,3 Mio. $ (Marge 36,7 %). Die Schulden sind gering (Nettoverschuldung
  178,7 Mio. $, 0,7 Mal bereinigtes EBITDA), der freie Cashflow der letzten zwölf Monate liegt bei rund 152 Mio. $ (12,7 % des
  Börsenwerts nach Agent-Rechnung), und die Firma kauft Aktien zurück (verwässerte Aktienzahl -10,3 % zum Vorjahr). Der Gewinn 2025
  war wegen einer nicht zahlungswirksamen Pensionsabwicklung von 82,8 Mio. $ niedrig. Schwäche: Das Geschäft hängt an Börsengängen,
  Übernahmen und Berichtsvolumen; der Druckbereich schrumpft (-15 %).
