# Business-model profiles per SimFin sectorCode (docs/decisions.md "Phase 2.0e", Issue #51).
# Loaded and validated once per full run by config_layer.sector_profiles.load_sector_profiles()
# before any company is evaluated: every key is required, no defaults exist in code.
#
# A survivor whose sectorCode is NOT listed under `sectors` (or is NULL) aborts the whole run
# before any evaluation and writes nothing - a missing code is an incomplete config, not a data
# problem of the company (Entscheidung 2). A new sectorCode therefore blocks the run until a
# line is added here. Every code of data/cache/universe/<as_of>/general_bulk.json is listed
# explicitly, including those in the standard profile.
#
# profiles:
#   supported: true  -> evaluated by Stage 1 as before.
#   supported: false -> status `unsupported_business_model`, not run through Stage 1; `reason` is
#                       required for such a profile and forbidden for a supported one.
# sectors:
#   borderline: true marks a sector that stays in its (supported) profile but is flagged for
#   review; it never changes status, flags or rank (Entscheidung 4). Not allowed on unsupported profiles.
# The comment after each code is the SimFin sector name (sectorCode's fine-grained name;
# the sectorName/industryName field labels are swapped in SimFin, Audit C2).

profiles:
  non_financial:
    supported: true
  banks:
    supported: false
    reason: "Banken: laut D2 (docs/decisions.md Phase 2.0a, Entscheidung 2) aus Stage 1 ausgenommen"
  insurance:
    supported: false
    reason: "Versicherer: laut D2 (docs/decisions.md Phase 2.0a, Entscheidung 2) aus Stage 1 ausgenommen"
  reits:
    supported: false
    reason: "REITs: laut D2 (docs/decisions.md Phase 2.0a, Entscheidung 2) aus Stage 1 ausgenommen"
  biotechnology:
    supported: false
    reason: "Biotech: laut D2 (docs/decisions.md Phase 2.0a, Entscheidung 2) aus Stage 1 ausgenommen"

