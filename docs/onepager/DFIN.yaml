bear:
  - "Das Geschäft hängt an Kapitalmarkt-Aktivität (Börsengänge, Übernahmen, Berichte); das 2. Quartal profitierte laut Firma von einer Erholung dieser Aktivität."
  - "Druck und Versand schrumpfen: Umsatz im 2. Quartal -15,0 % auf 34,6 Mio. $; auch klassische Pflichtberichte (Fonds, Kapitalmarkt) sinken."
  - "Der Ausblick für das 3. Quartal (Umsatz 175 bis 185 Mio. $, Marge 26 bis 28 %) liegt unter dem Niveau des 2. Quartals (224 Mio. $, 36,7 %); ob das ein Saisonmuster ist, wurde nicht untersucht."
  - "Der Gewinn 2025 war mit 32,4 Mio. $ niedrig (2024: 92,4), wegen einer nicht zahlungswirksamen Pensionsabwicklung von 82,8 Mio. $."
  - "Die Branche Finanzdienstleistungen ist im Archiv als Grenzfall markiert (Kapitalmarkt-Dienstleister); die Vergleichsgruppe passt nur begrenzt."
