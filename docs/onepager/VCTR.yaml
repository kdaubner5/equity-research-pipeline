thesis: 'Victory Capital verwaltet Vermögen (Fonds, ETFs, Mandate) und wächst durch Zukäufe. 2025 übernahm es Amundi US; deshalb stieg der Umsatz im 1. Halbjahr 2026 um 44 % auf 823 Mio. $ und das Betriebsergebnis auf 353 Mio. $ (Vorjahr 187). Das verwaltete Vermögen lag Ende September 2026 bei 351,9 Mrd. $, mit 11,7 Mrd. $ Nettozuflüssen im 3. Quartal (Meldung vom 12.10.2026). Am 25./26.08.2026 (Vertrag 25.08., Mitteilung 26.08.) vereinbarte die Firma den Kauf von First Eagle (222 Mrd. $ Vermögen) für rund 7,0 Mrd. $: 4,4 Mrd. $ bar, 2,0 Mrd. $ in neuen Aktien, dazu übernommene Anleihen von 575 Mio. $. Finanziert wird mit einem neuen Term Loan B von 3,5 Mrd. $, rund 950 Mio. $ neuen Anleihen und einem aufgestockten Revolver; der Verkäufer Genstar hielte danach rund 14,6 %. Die Firma erwartet rund 35 % mehr bereinigten Gewinn je Aktie 2027. Der freie Cashflow der letzten zwölf Monate liegt bei rund 564 Mio. $ (8,5 % des Börsenwerts laut Archivkurs); die jetzigen Nettoschulden betragen rund 0,9 Mrd. $.'
