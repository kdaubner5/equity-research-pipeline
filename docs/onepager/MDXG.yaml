thesis: >-
  MiMedx liefert Gewebe-Produkte für Wundheilung und Chirurgie. Auf den Geschäftsjahren sieht die Firma sehr gut aus (ROIC 36 %,
  Nettokasse, freier Cashflow 2025 rund 73 Mio. $). Doch seit Januar 2026 gelten neue Medicare-Erstattungsregeln für Hautersatzprodukte:
  Der Wundgeschäft-Umsatz fiel im 2. Quartal um 61 %, der Gesamtumsatz um 35 % auf 64 Mio. $, es gab einen Nettoverlust von 15 Mio. $.
  Die Firma erwartet für 2026 nur 260 bis 290 Mio. $ Umsatz (2025: 418,6) und ein bereinigtes EBITDA nahe null. Gleichzeitig will sie
  Sanara MedTech für rund 350 Mio. $ kaufen, finanziert mit einem neuen Kredit von 300 Mio. $. Der Filter rechnet noch mit 2025;
  mit dem Betriebsergebnis der letzten zwölf Monate (8,8 Mio. $) ist das EV/EBITDA von 7,1 nicht mehr aussagekräftig.
