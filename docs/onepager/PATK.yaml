thesis: >-
  Patrick liefert Bauteile für Wohnmobile (RV, 39 % des Umsatzes im 2. Quartal), Boote, Geländefahrzeuge und Fertighäuser. Am 30.06.2026
  vereinbarte die Firma einen reinen Aktientausch mit dem Wettbewerber LCI Industries (je LCI-Aktie 1,2440 Patrick-Aktien; danach Patrick-Aktionäre
  rund 52 %, LCI-Aktionäre rund 48 %). Der Abschluss wird für das 1. Halbjahr 2027 erwartet. Die Aktie fiel von 93,18 $ (29.06.) auf 69,18 $
  (23.09., Archiv), rund 26 %. Operativ: Umsatz im 2. Quartal -1 %, RV-Umsatz -15 %, Betriebsmarge 7,4 % nach 8,3 %, freier Cashflow der
  letzten zwölf Monate rund 128 Mio. $ (5,6 % des Börsenwerts), Verschuldung laut Kreditvertrag 3,0 Mal EBITDA (Stufe 1 auf Basis 2025: 2,02).
