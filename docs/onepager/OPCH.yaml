thesis: Option Care Health ist der größte unabhängige Anbieter von Infusionstherapie zu Hause und in ambulanten Zentren. Im 2. Quartal 2026 stieg der Umsatz um 1,9 % auf 1.442 Mio. $, der Nettogewinn um 6,7 % auf 53,9 Mio. $, das bereinigte EBITDA um 3,0 % auf 117,5 Mio. $; der operative Cashflow betrug 184 Mio. $, und die Firma kaufte im Quartal für 150 Mio. $ eigene Aktien zurück. Die Prognose vom 29.07. (Umsatz 5,675 bis 5,775 Mrd. $, bereinigtes EBITDA 480 bis 495 Mio. $, operativer Cashflow mindestens 320 Mio. $) wurde mit dem Angebot am 06.10.2026 zurückgezogen. Am 05./06.10.2026 vereinbarte Option Care Health den Verkauf an einen Investorenkreis aus CD&R (Mehrheit, rund 51 %) und McKesson (rund 1,4 Mrd. $, rund 49 %) für 32,05 $ je Aktie bar, Unternehmenswert rund 5,8 Mrd. $; das ist eine Prämie von rund 37 % auf den Schlusskurs vom 05.10.2026. Abschluss im ersten Halbjahr 2027, nach Zustimmung der Aktionäre und der Behörden; danach ist die Aktie nicht mehr börsennotiert. Der freie Cashflow der letzten zwölf Monate liegt bei rund 304 Mio. $ (8,7 % des Archiv-Börsenwerts).
