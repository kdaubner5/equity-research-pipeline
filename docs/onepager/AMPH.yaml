verdict:
  label: ZURÜCKSTELLEN
  tone: warn
  text: Vorschlag des Agenten, Entscheidung durch Konstantin. Am 02.07.2026 erhielt die Tochter IMS einen FDA-Warnbrief für ihr Werk in South El Monte; das Betriebsergebnis fiel schon im 1. Halbjahr um 33 %, und die Schulden liegen bei rund 400 Mio. $ netto.
  legend: 'Was bedeutet ZURÜCKSTELLEN? Die Firma besteht den Filter und bleibt auf der Liste, ist aber noch nicht reif für eine Entscheidung: Wir warten auf ein benanntes Ereignis (hier: Antwort der FDA auf den Sanierungsplan der IMS und Quartalsbericht Q3 2026) und rechnen dann neu. Es ist weder eine Kauf- noch eine Verkaufsempfehlung.'
thesis: Amphastar stellt Arzneimittel zum Spritzen, Inhalieren und für die Nase her (Generika und eigene Marken, darunter Primatene MIST). Im 2. Quartal 2026 stieg der Umsatz um 5 % auf 183,9 Mio. $, der Nettogewinn betrug 30,3 Mio. $ (Gewinn je Aktie 0,67 $, bereinigt 0,91 $). Im 1. Halbjahr sank das Betriebsergebnis um 33 % auf 53,4 Mio. $ und der Nettogewinn auf 36,8 Mio. $ (Vorjahr 56,3); die Firma nennt „Preis- und Wettbewerbsdruck in Teilen des Portfolios“. Am 02.07.2026 erhielt die Tochter International Medication Systems einen FDA-Warnbrief (cGMP-Verstöße in Untersuchungsverfahren, Umgebungsüberwachung und Anlagen); es gibt keine Anordnung zu Stopp oder Rückruf, die Produktion läuft weiter, die Firma „kann den Ausgang nicht zusichern“. Der freie Cashflow der letzten zwölf Monate liegt bei rund 153 Mio. $ (14,4 % des Börsenwerts); die Nettoschulden betragen rund 397 Mio. $ (davon 345 Mio. $ Wandelanleihe 2029).
