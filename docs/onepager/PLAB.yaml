not_checked: "Die Peer-Gruppe Semiconductors (9 Firmen) passt kaum: Sie enthält Chip-Hersteller und Ausrüster mit EV/EBITDA von meist 20 bis 80 (Ausnahme XPER) sowie einen Solarinstallateur (Sunrun); Photronics ist ein Zulieferer von Masken. Das EV/EBITDA mit Minderheitsanteilen ist eine Agent-Rechnung (Buchwert der Minderheiten 463 Mio. $, Schulden grob aus der Bilanz); die Nettokasse ist aus der Pressemitteilung (672,8 Mio. $) abzüglich der Schulden gerundet. Die genaue Aufteilung des Gewinns und der Kasse zwischen Photronics und den Gemeinschaftsunternehmen und die Abhängigkeit von China sind nicht ausgewertet. Offen sind der heutige Kurs und die Wirkung von Exportkontrollen. Entwurf des Agenten, ohne die Prompts Bear/Bull/Synthese."
peer_note: "Vollständige Peer-Gruppe aus dem Zwischenspeicher neu gerechnet (Export vom 12.10.2026); in der Gruppe fehlt 1 Firma wegen Datenfehlers (CNXT). XPER wurde aus der Kandidatenliste gestrichen (Datenfehler). Die Gruppe passt kaum."
peer_summary: "Gegen die 9 Firmen der Peer-Gruppe: EV/EBITDA 4,5 gegen Median 26,0 (Platz 2 von 9), FCF-Rendite 6,7 % gegen Median 2,4 % (Platz 2 von 9). Archivwerte der Geschäftsjahre; der Vergleich ist wenig aussagekräftig, weil die Gruppe aus Chip-Herstellern mit ganz anderen Bewertungen besteht."
