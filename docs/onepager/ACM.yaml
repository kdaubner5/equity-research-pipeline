bear:
- 337 Mio. $ Vorsteuerverlust auf ein Projekt aus 2019; Fertigstellung später als geplant, Nachforderungen können „mehrere Jahre und Rechtsstreit“ dauern (Firmenangabe).
- Freier Cashflow der letzten zwölf Monate rund 203 Mio. $ (2,6 % des Börsenwerts laut Archivkurs); 2025 waren es 685 Mio. $.
- Nettoschulden 1.732 Mio. $ nach 754 Mio. $ ein Jahr zuvor; die Firma nennt einen Verschuldungsgrad von 1,5x.
- 'Der Filter sieht davon nichts: Stufe 1 und 2 rechnen mit dem Geschäftsjahr bis 30.09.2025 (Betriebsergebnis rund 1.027 Mio. $), die letzten zwölf Monate liegen bei 631 Mio. $.'
- 'Prognose für den Umsatzzuwachs (NSR) gesenkt: verzögerte Projektstarts und der Nahost-Konflikt (Pressemitteilung).'
- Der 10-Q nennt zwei verzögerte Construction-Management-Projekte mit bedeutenden Nachforderungen und eine „vernünftige Möglichkeit“, dass Kunden wesentliche Gegenansprüche erheben.
bull:
- 'Ohne das Projekt: bereinigtes EBITDA 329 Mio. $ (+5 %), bereinigtes Ergebnis je Aktie 1,49 $ (+11 %), bereinigte Segmentmarge 16,5 %.'
- Rekord-Auftragsbestand 27,8 Mrd. $ (+13 %), neue Aufträge 4,2 Mrd. $ im Quartal (Book-to-Burn 1,6).
- Die Firma erwartet weiter positiven freien Cashflow (rund 300 Mio. $ für FY26).
- Zwei der größten Verlängerungen der Firmengeschichte gewonnen (laut Pressemitteilung).
- Dividende 0,31 $ je Quartal fortgesetzt.
