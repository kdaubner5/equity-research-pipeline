thesis: >-
  MGM betreibt Kasinos und Hotels in Las Vegas und den USA, in Macau (MGM China) und ein Online-Geschäft. Im 2. Quartal 2026 stieg der Umsatz
  um 1 % auf 4,5 Mrd. $; der Nettogewinn sprang auf 292 Mio. $ (Vorjahr 49), vor allem wegen eines Verkaufsgewinns von rund 287 Mio. $
  (Northfield Park). Der bereinigte Gewinn je Aktie fiel auf 0,59 $ nach 0,79 $. Der freie Cashflow der letzten zwölf Monate liegt bei rund
  1,49 Mrd. $ (15,4 % des Börsenwerts), enthält aber die Minderheitsanteile an MGM China. Schulden 6,07 Mrd. $, Kasse 2,55 Mrd. $; dazu
  kommen Mietverpflichtungen von 23,8 Mrd. $ (Barmiete an VICI 722 Mio. $ im Jahr), die Net Debt/EBITDA und EV des Filters nicht enthalten.
