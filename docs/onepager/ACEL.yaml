bear:
- Freier Cashflow 1. Halbjahr nur 28,7 Mio. $ (Vorjahr 11,8); im 2. Quartal 10 Mio. $, wegen Kauf einer Steuergutschrift (ohne sie 26 Mio. $).
- Nettoschulden 318 Mio. $ (Firmenangabe); Schulden 573 Mio. $ gegen Kasse 255 Mio. $.
- Das Geschäft hängt an staatlichen Genehmigungen (Illinois, Chicago, weitere Staaten) und an der Steuerpolitik für Spielgeräte.
- Aktienzahl laut Archiv „ungeprüft“ (Infomarke); Earnout-Aktien aus dem Fairmount-Kauf sind noch offen (Neubewertung kostete 5 Mio. $ im Quartal).
- 'Die Betriebsmarge liegt nur bei rund 8 % (2025: 107,9 Mio. $ auf 1.331 Mio. $ Umsatz; 2024: 90,9).'
bull:
- Umsatz von 1.170 (2023) auf 1.331 Mio. $ (2025); 1. Halbjahr 2026 +9 %.
- 'Chicago: Genehmigungen laufen; 17 der bisher genehmigten Standorte (44 %) sind Accel-Standorte.'
- Fairmount Park lieferte im Q2 den höchsten Quartals-Bruttogewinn seit der Übernahme; Tischspiele gestartet.
- Nebraska und Georgia wachsen deutlich (bereinigtes EBITDA).
- Rückkaufprogramm läuft (0,5 Mio. Aktien im Q2).
