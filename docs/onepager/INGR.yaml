  legend: 'Was bedeutet ZURÜCKSTELLEN? Die Firma besteht den Filter und bleibt auf der Liste, ist aber noch nicht reif für eine Entscheidung: Wir warten auf ein benanntes Ereignis (hier: Freigaben und Finanzierung des Tate-&-Lyle-Kaufs sowie Quartalsbericht Q3 2026) und rechnen dann neu. Es ist weder eine Kauf- noch eine Verkaufsempfehlung.'
thesis: 'Ingredion verarbeitet Mais und andere Pflanzen zu Stärken, Süßungsmitteln und Zutaten für Lebensmittel. Im 1. Halbjahr 2026 blieb der Umsatz mit 3.642 Mio. $ flach, das Betriebsergebnis fiel um 29 % auf 391 Mio. $: höhere Herstellkosten, Kosten eines thermischen Ereignisses im Werk Argo und Aufwand für die Schließung des Werks Cabo (Brasilien). Am 08.06.2026 vereinbarte die Firma den Kauf von Tate & Lyle (London) für rund 2,7 Mrd. £ (3,5 Mrd. $) bar; Abschluss erwartet im 2. Halbjahr 2027, die Schulden könnten von 1,8 auf bis zu rund 6,0 Mrd. $ steigen. Der freie Cashflow der letzten zwölf Monate liegt bei rund 355 Mio. $ (5,8 % des Börsenwerts), 2025 waren es 511 Mio. $. Am 30.06.2026 verkaufte INGR 51 % der pakistanischen Rafhan Maize für rund 165 Mio. $.'
