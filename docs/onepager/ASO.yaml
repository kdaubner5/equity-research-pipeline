bear:
- Vergleichbare Fläche im 2. Quartal -0,4 %; CEO nennt Konsumdruck, besonders bei Haushalten mit niedrigem Einkommen.
- 83,7 Mio. $ IEEPA-Rückerstattung stecken im Cashflow und in der Marge (netto 0,06 $ Gewinn je Aktie nach Weitergabe und Reinvestition); 72,2 Mio. $ „Weitergabe von Rückerstattungsansprüchen“ stehen separat im Finanzierungs-Cashflow.
- Betriebsergebnis 2025 mit 512 Mio. $ nach 678 (2023) und 539 (2024); nur im 1. Halbjahr 2026 wieder +33 %.
- Mieten für Filialen sind nicht in den Schulden (Nettoschulden 196 Mio. $ ohne Mieten).
- 'Starkes Filialwachstum (24 neue Filialen 2025, weitere 2026) bindet Kapital: Investitionen 213 Mio. $ im Jahr 2025.'
bull:
- Gewinn je Aktie im 1. Halbjahr +17 % (bereinigt +19 %); Prognose für das Gesamtjahr angehoben (bereinigtes EPS 6,50 bis 6,90 $).
- 'Aktienrückkäufe: 182 Mio. $ im 1. Halbjahr (Vorjahr 100); verwässerte Aktienzahl laut Prognose 64,5 Mio. (2025: ca. 68).'
- Online-Umsatz +12,8 %; neue Filialen mit vergleichbarem Umsatz im mittleren einstelligen Plus (Pressemitteilung).
- 'Geringe Verschuldung: Nettoschulden 196 Mio. $ gegen ein Betriebsergebnis von 592 Mio. $ (12 Monate).'
- 'Prognose bereinigter freier Cashflow 2026: 300 bis 350 Mio. $ (vorher 250 bis 300).'
