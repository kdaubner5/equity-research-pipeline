thesis: Boise Cascade vertreibt Baustoffe (Building Materials Distribution) und stellt Holzprodukte her. Im 2. Quartal 2026 stieg der Umsatz um 5 % auf 1,83 Mrd. $; der Nettogewinn sank leicht auf 57,3 Mio. $ (Gewinn je Aktie 1,63 $ nach 1,64 $), das bereinigte EBITDA stieg um 6 % auf 126,2 Mio. $. Die Verteilsparte verdiente 10 % weniger, die Holzprodukte 84 % mehr. Seit 2022 ist das Betriebsergebnis von 1.158 auf 183 Mio. $ (2025) gefallen; in den letzten zwölf Monaten liegt es bei 160 Mio. $. Der freie Cashflow der letzten zwölf Monate beträgt rund 103 Mio. $ (3,8 % des Börsenwerts), der Archiv-Dreijahreswert 8,7 %. Mit 148 Mio. $ Nettoschulden ist die Bilanz solide. Am 03.08.2026 wurde Boise Cascade alleiniger landesweiter Distributor des James-Hardie-Portfolios (Hardie, AZEK, TimberTech).
