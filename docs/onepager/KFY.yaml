thesis: 'Korn Ferry vermittelt Führungskräfte und berät Unternehmen bei Personal und Organisation (Geschäftsjahr bis 30.04.). Im ersten Quartal des Geschäftsjahres 2027 (Mai bis Juli 2026) stieg der Gebührenumsatz um 7 % auf 756,5 Mio. $, das sechste Wachstumsquartal in Folge; der Auftragsbestand liegt bei 1,9 Mrd. $ (+14 %). Zum 31.07.2026 hatte die Firma mehr Kasse (800,9 Mio. $) als Schulden (398,8 Mio. $). Am 01.09.2026 kaufte sie AMS (Recruiting-Auslagerung, Großbritannien) für 1,2 Mrd. $: 0,9 Mrd. $ bar (rund 0,6 Mrd. $ über Kredite) plus 3,1 Mio. neue Aktien (0,3 Mrd. $). Danach liegen die Schulden bei rund 1,0 Mrd. $ und die Nettoposition bei rund 0,5 Mrd. $ Schulden (Agent, grob). Wie viel Umsatz und Gewinn AMS beiträgt, steht in den Unterlagen nicht.'
