  legend: 'Was bedeutet ZURÜCKSTELLEN? Die Firma besteht den Filter und bleibt auf der Liste, ist aber noch nicht reif für eine Entscheidung: Wir warten auf ein benanntes Ereignis (hier: Quartalsbericht Q3 2026 mit einem vollen Quartal Eddyfi) und rechnen dann neu. Es ist weder eine Kauf- noch eine Verkaufsempfehlung.'
thesis: ESAB stellt Schweiß- und Schneidtechnik und Verbrauchsmaterial her. Im 2. Quartal 2026 stieg der Umsatz um 12,9 % auf einen Rekord von 808 Mio. $ (organisch im Kerngeschäft +2,5 %); das bereinigte Kern-EBITDA stieg um 8 % auf 150 Mio. $, die Marge fiel um 0,9 Prozentpunkte auf 19,5 % (Preis und Kosten neutral, Investitionen in den Vertrieb). Das berichtete Betriebsergebnis des 1. Halbjahrs sank um 23 % auf 169 Mio. $. Am 01.06.2026 kaufte ESAB Eddyfi (Prüf- und Inspektionstechnik, Kanada) für 1,45 Mrd. $ bar, finanziert aus Kasse, 5,625-%-Anleihen 2031, einer Privatplatzierung von 175 Mio. $ Pflicht-Wandel-Vorzugsaktien (6,5 %) und 1,25 Mio. neuen Stammaktien (143 Mio. $). Die langfristigen Schulden stiegen von 1,23 auf 2,39 Mrd. $; die Nettoschulden betragen rund 2,18 Mrd. $. Der freie Cashflow der letzten zwölf Monate liegt bei rund 197 Mio. $ (4,7 % des Börsenwerts laut Archivkurs). Am 10.06.2026 wurde Mitchell Rales Executive Chair des Verwaltungsrats.
