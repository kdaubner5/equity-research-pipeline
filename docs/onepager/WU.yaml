bear:
- Betriebsmarge Q2 13 % nach 19 %; Betriebsergebnis 1. Halbjahr 255 Mio. $ nach 370 (-31 %).
- 'Intermex-Abschluss verzögert: Kalifornien hat seine Genehmigung ausgesetzt; die Prognose 2026 unterstellte den Abschluss am 01.09.2026, der nicht eintrat.'
- Der Gesamtumsatz sank von 4.357 (2023) auf 4.051 Mio. $ (2025) und stagniert im 1. Halbjahr 2026 (1.996 nach 2.010).
- 'Archivmarken: Cash Conversion 0,92 (Grauzone), Stufe-1-Datenmarke `debt_component_missing_defaulted_zero`, Grenzfall-Branche.'
- Cashflow-Zahlen eines Zahlungsdienstleisters schwanken mit Abwicklungsposten; die 12-Monats-Rendite von 29,8 % ist nur mit Vorsicht zu lesen.
bull:
- 'Digital wächst: Branded Digital +7 %, Transaktionen +25 %, 32 % der Umsätze im Geldtransfer.'
- Consumer Services +4 % (bereinigt +12 %).
- Freier Cashflow der letzten zwölf Monate rund 565 Mio. $; Dividenden 152,8 Mio. $ im Halbjahr gezahlt.
- Der Konzernchef kündigt schärfere Kostensenkungen im 2. Halbjahr an.
- Gesamtschulden zum Nennwert von 2.885 (Dezember 2025) auf 2.710 Mio. $ gesenkt (davon 2.510 mit Fälligkeit nach über einem Jahr).
